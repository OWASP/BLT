# The dashboard is static (public/). The Worker (worker/index.js) also serves two data files from
# KV, refreshed daily when blt-cron calls POST /__scheduled:
#   /data/github-contributions.json  and  /data/forks.json
# Secrets: CRON_SECRET (same value as blt-cron), GH_API_TOKEN.
name = "my-gsoc-tool"
main = "worker/index.js"
compatibility_date = "2026-06-06"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/__scheduled", "/data/github-contributions.json", "/data/forks.json"]

# Created by scripts/worker-data/create-kv.sh, which replaces the placeholder id.
[[kv_namespaces]]
binding = "DATA"
id = "aed40ef69d07434da99cb671d4b89502"
