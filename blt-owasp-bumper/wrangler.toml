# Static site (public/) plus a Worker (worker/index.js) that serves the generated data
# (/data/repos.json) from KV (binding DATA). The workflow .forkmesh/blt-owasp-bumper--generate-repo-list.yml
# (daily) writes it; nothing is committed to git.
name = "blt-owasp-bumper"
main = "worker/index.js"
compatibility_date = "2026-06-06"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/data/repos.json"]

# Created by scripts/worker-data/create-kv.sh, which replaces the placeholder id.
[[kv_namespaces]]
binding = "DATA"
id = "a79d358f10af4f88a13d4baf47dbe754"
