# Static site (public/) plus a Worker (worker/index.js) that serves the generated page (/ and
# /index.html) from KV (binding DATA). The workflow .forkmesh/blt-owasp-bumper--generate-repo-list.yml
# (daily) writes it; nothing is committed to git.
name = "blt-owasp-bumper"
main = "worker/index.js"
compatibility_date = "2026-06-06"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html"]

# Created by scripts/worker-data/create-kv.sh, which replaces the placeholder id.
[[kv_namespaces]]
binding = "DATA"
id = "REPLACE_WITH_KV_ID_blt-owasp-bumper-data"
