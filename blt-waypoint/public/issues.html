<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BLT Waypoint – Open issues</title>
  <meta name="description"
    content="All open issues of the OWASP BLT projects on git.owaspblt.org, searchable and filterable by project and label, refreshed daily." />
  <link rel="icon" type="image/svg+xml" href="./imgs/blt-logo.svg" />
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="styles.css?v=0.4.0" />
  <script src="https://owaspblt.org/_shared/blt-nav.js" defer></script>
  <script src="script.js?v=0.4.0" defer></script>
</head>

<body data-page="issues">

  <blt-nav project="blt-waypoint" name="Waypoint" data-sticky>
    <a href="./index.html">Dashboard</a>
    <a href="./issues.html" aria-current="page">Issues</a>
    <a href="./screenshots.html">Screenshots</a>
    <a href="https://git.owaspblt.org/BLT/tree/main/blt-waypoint" target="_blank" rel="noopener noreferrer" slot="actions">Source</a>
  </blt-nav>

  <main class="wrap">
    <div class="page-head">
      <div>
        <h1>Open issues</h1>
        <p>Every open issue on <a href="https://git.owaspblt.org/BLT/issues" target="_blank" rel="noopener noreferrer">git.owaspblt.org/BLT</a>, labelled by project folder.</p>
      </div>
      <span class="fresh" data-fresh hidden></span>
    </div>

    <section id="stats" class="stats four" aria-label="Totals">
      <div class="skeleton sk-stat"></div><div class="skeleton sk-stat"></div>
      <div class="skeleton sk-stat"></div><div class="skeleton sk-stat"></div>
    </section>

    <div class="toolbar">
      <label class="search grow">
        <span class="sr-only">Search issues</span>
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="search" class="input" type="search" placeholder="Search title, number, author, label…" autocomplete="off" />
      </label>
      <label class="sr-only" for="project">Project</label>
      <select id="project" class="select">
        <option value="">All projects</option>
      </select>
      <label class="sr-only" for="sort">Sort issues</label>
      <select id="sort" class="select">
        <option value="updated">Recently updated</option>
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="comments">Most comments</option>
      </select>
      <button id="group" type="button" class="btn" aria-pressed="false" title="Group by project">
        <i class="fa-solid fa-layer-group" aria-hidden="true"></i><span class="hide-sm">Group</span>
      </button>
    </div>

    <div id="labels" class="chips" role="group" aria-label="Filter by label"></div>

    <p id="count" class="count-line" aria-live="polite"></p>

    <div id="results">
      <div class="panel">
        <div class="skeleton sk-row"></div><div class="skeleton sk-row"></div><div class="skeleton sk-row"></div>
        <div class="skeleton sk-row"></div><div class="skeleton sk-row"></div><div class="skeleton sk-row"></div>
      </div>
    </div>
  </main>

  <footer class="foot">
    <div class="wrap">
      <span data-foot>Data from <a href="https://git.owaspblt.org/BLT" target="_blank" rel="noopener noreferrer">git.owaspblt.org</a>, refreshed daily.</span>
      <span>Built for <a href="https://owaspblt.org" target="_blank" rel="noopener noreferrer">OWASP BLT</a></span>
    </div>
  </footer>
</body>

</html>
