<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BLT Waypoint – Live sites</title>
  <meta name="description"
    content="Screenshots of every live OWASP BLT site, captured daily." />
  <link rel="icon" type="image/svg+xml" href="./imgs/blt-logo.svg" />
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="styles.css?v=0.5.0" />
  <script src="https://owaspblt.org/_shared/blt-nav.js" defer></script>
  <script src="script.js?v=0.5.0" defer></script>
</head>

<body data-page="screenshots">

  <blt-nav project="blt-waypoint" name="Waypoint" data-sticky>
    <a href="./index.html">Dashboard</a>
    <a href="./issues.html">Issues</a>
    <a href="./screenshots.html" aria-current="page">Screenshots</a>
    <a href="https://git.owaspblt.org/BLT/tree/main/blt-waypoint" target="_blank" rel="noopener noreferrer" slot="actions">Source</a>
  </blt-nav>

  <main class="wrap">
    <div class="page-head">
      <div>
        <h1>Live sites</h1>
        <p id="sub">Every BLT project with a live site, captured once a day.</p>
      </div>
      <span class="fresh" data-fresh hidden></span>
    </div>

    <div class="toolbar">
      <label class="search grow">
        <span class="sr-only">Search sites</span>
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="search" class="input" type="search" placeholder="Search sites…" autocomplete="off" />
      </label>
      <label class="sr-only" for="sort">Sort sites</label>
      <select id="sort" class="select">
        <option value="name">Name</option>
        <option value="captured">Recently captured</option>
      </select>
    </div>

    <div id="notice"></div>
    <p id="count" class="count-line" aria-live="polite"></p>

    <div id="results" class="shots">
      <div class="skeleton" style="aspect-ratio:16/12"></div><div class="skeleton" style="aspect-ratio:16/12"></div>
      <div class="skeleton" style="aspect-ratio:16/12"></div><div class="skeleton" style="aspect-ratio:16/12"></div>
    </div>
  </main>

  <footer class="foot">
    <div class="wrap">
      <span data-foot>Data from <a href="https://git.owaspblt.org/BLT" target="_blank" rel="noopener noreferrer">git.owaspblt.org</a>, refreshed daily.</span>
      <span>Built for <a href="https://owaspblt.org" target="_blank" rel="noopener noreferrer">OWASP BLT</a></span>
    </div>
  </footer>
</body>

</html>
