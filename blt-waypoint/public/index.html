<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BLT Waypoint – Projects</title>
  <meta name="description"
    content="Every OWASP BLT project in one place: each folder of the monorepo on git.owaspblt.org with its live site, last commit, open issues and pull requests, refreshed daily." />
  <link rel="icon" type="image/svg+xml" href="./imgs/blt-logo.svg" />
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="styles.css?v=0.5.0" />
  <script src="https://owaspblt.org/_shared/blt-nav.js" defer></script>
  <script src="script.js?v=0.5.0" defer></script>
</head>

<body data-page="dashboard">

  <blt-nav project="blt-waypoint" name="Waypoint" data-sticky>
    <a href="./index.html" aria-current="page">Dashboard</a>
    <a href="./issues.html">Issues</a>
    <a href="./screenshots.html">Screenshots</a>
    <a href="https://git.owaspblt.org/BLT/tree/main/blt-waypoint" target="_blank" rel="noopener noreferrer" slot="actions">Source</a>
  </blt-nav>

  <main class="wrap">
    <div class="page-head">
      <div>
        <h1>Projects</h1>
        <p>Every folder of the <a href="https://git.owaspblt.org/BLT" target="_blank" rel="noopener noreferrer">BLT monorepo</a>, with its live site, activity and open work.</p>
      </div>
      <span class="fresh" data-fresh hidden></span>
    </div>

    <section id="stats" class="stats" aria-label="Totals">
      <div class="skeleton sk-stat"></div><div class="skeleton sk-stat"></div><div class="skeleton sk-stat"></div>
      <div class="skeleton sk-stat"></div><div class="skeleton sk-stat"></div><div class="skeleton sk-stat"></div><div class="skeleton sk-stat"></div>
    </section>

    <div class="toolbar">
      <label class="search grow">
        <span class="sr-only">Search projects</span>
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="search" class="input" type="search" placeholder="Search name, folder, description, site…" autocomplete="off" />
      </label>
      <label class="sr-only" for="sort">Sort projects</label>
      <select id="sort" class="select">
        <option value="last">Last commit</option>
        <option value="rating">Rating</option>
        <option value="name">Name</option>
        <option value="issues">Open issues</option>
        <option value="prs">Open PRs</option>
        <option value="c30">Commits, 30 days</option>
        <option value="c365">Commits, 1 year</option>
        <option value="people">Contributors</option>
      </select>
      <div class="seg" role="group" aria-label="Layout">
        <button type="button" data-view="table" aria-pressed="true" title="Table"><i class="fa-solid fa-table-list" aria-hidden="true"></i><span class="sr-only">Table</span></button>
        <button type="button" data-view="cards" aria-pressed="false" title="Cards"><i class="fa-solid fa-grip" aria-hidden="true"></i><span class="sr-only">Cards</span></button>
      </div>
    </div>

    <div id="filters" class="chips" role="group" aria-label="Filter projects"></div>

    <p id="count" class="count-line" aria-live="polite"></p>

    <div id="results">
      <div class="panel">
        <div class="skeleton sk-row"></div><div class="skeleton sk-row"></div><div class="skeleton sk-row"></div>
        <div class="skeleton sk-row"></div><div class="skeleton sk-row"></div><div class="skeleton sk-row"></div>
      </div>
    </div>
  </main>

  <footer class="foot">
    <div class="wrap">
      <span data-foot>Data from <a href="https://git.owaspblt.org/BLT" target="_blank" rel="noopener noreferrer">git.owaspblt.org</a>, refreshed daily.</span>
      <span>Built for <a href="https://owaspblt.org" target="_blank" rel="noopener noreferrer">OWASP BLT</a></span>
    </div>
  </footer>
</body>

</html>
