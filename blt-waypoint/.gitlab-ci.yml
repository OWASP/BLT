image: node:22-bookworm

stages:
  - build

variables:
  CLOUDFLARE_PROJECT_NAME: "blt-waypoint"

before_script:
  - python3 --version
  - node --version
  - npm --version

build_site:
  stage: build
  script:
    - sh scripts/build_static.sh
  artifacts:
    paths:
      - public
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
