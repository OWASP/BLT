name = "blt-timer"
main = "src/worker.py"
compatibility_date = "2024-12-02"
compatibility_flags = ["python_workers"]
workers_dev = true

[assets]
directory = "./public"

[env.production]
name = "blt-timer"

# Local development binding. Wrangler uses this binding for `wrangler dev` and
# `./migrate.sh dev` with a local D1 database.
[[d1_databases]]
binding = "DB"
database_name = "blt-apps"
database_id = "540fc4ae-6347-43fd-b6da-1fcc4eb219d9"
migrations_dir = "migrations"
migrations_table = "d1_migrations_timer"

# Environment bindings are not inherited from the top-level configuration.
# Keep this in sync with the local binding so production receives `env.DB`.
[[env.production.d1_databases]]
binding = "DB"
database_name = "blt-apps"
database_id = "540fc4ae-6347-43fd-b6da-1fcc4eb219d9"
migrations_dir = "migrations"
migrations_table = "d1_migrations_timer"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
