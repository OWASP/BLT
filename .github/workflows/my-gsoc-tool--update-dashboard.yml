# Ported from my-gsoc-tool/.github/workflows/update-dashboard.yml (runs inside my-gsoc-tool/)
name: 'my-gsoc-tool: Update GSoC Dashboard'
on:
  schedule:
  - cron: 0 0 * * *
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - my-gsoc-tool/public/config.json
    - my-gsoc-tool/public/data/**
permissions:
  contents: write
  pages: write
  id-token: write
defaults:
  run:
    working-directory: my-gsoc-tool
jobs:
  fetch-github-contributions:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Fetch GitHub contributions
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "# Create scripts directory if it doesn't exist\nmkdir -p scripts\n\n# Create a simple script to fetch GitHub data\ncat > scripts/fetch-github-data.js << 'EOF'\nconst fs = require('fs');\nconst https = require('https');\n\n// Read config\nconst config = JSON.parse(fs.readFileSync('public/config.json', 'utf8'));\n\n// Extract GitHub username from URL\nconst githubUrl = config.student?.github || '';\nconst username = githubUrl.split('/').pop() || 'example-user';\nconst repo = config.project?.repository ? config.project.repository.split('/').slice(-2).join('/') : '';\n\nconsole.log(`Fetching data for user: ${username}`);\n\n// Function to make GitHub API request\nfunction makeRequest(path) {\n  return new Promise((resolve, reject) => {\n    const options = {\n      hostname: 'api.github.com',\n      path: path,\n      headers: {\n        'User-Agent': 'GSoC-Dashboard',\n        'Authorization': `token ${process.env.GITHUB_TOKEN}`,\n        'Accept': 'application/vnd.github.v3+json'\n\
        \      }\n    };\n\n    https.get(options, (res) => {\n      let data = '';\n      res.on('data', (chunk) => data += chunk);\n      res.on('end', () => {\n        try {\n          resolve(JSON.parse(data));\n        } catch (e) {\n          resolve([]);\n        }\n      });\n    }).on('error', reject);\n  });\n}\n\n// Main function\nasync function fetchData() {\n  try {\n    // Get user events\n    const events = await makeRequest(`/users/${username}/events/public?per_page=100`);\n    \n    // Count contributions\n    const stats = {\n      commits: 0,\n      pullRequests: 0,\n      issues: 0,\n      reviews: 0\n    };\n\n    const contributions = [];\n    const seenEvents = new Set();\n\n    events.forEach(event => {\n      const eventId = event.id;\n      if (seenEvents.has(eventId)) return;\n      seenEvents.add(eventId);\n\n      if (event.type === 'PushEvent') {\n        stats.commits += event.payload.commits?.length || 0;\n        contributions.push({\n          title: `Pushed\
        \ commits to ${event.repo.name}`,\n          description: event.payload.commits?.[0]?.message || 'Code changes',\n          date: event.created_at.split('T')[0],\n          url: `https://github.com/${event.repo.name}`,\n          type: 'commit'\n        });\n      } else if (event.type === 'PullRequestEvent') {\n        stats.pullRequests++;\n        contributions.push({\n          title: `${event.payload.action} PR: ${event.payload.pull_request.title}`,\n          description: event.payload.pull_request.body?.substring(0, 150) || 'Pull request',\n          date: event.created_at.split('T')[0],\n          url: event.payload.pull_request.html_url,\n          type: 'pull_request'\n        });\n      } else if (event.type === 'IssuesEvent') {\n        stats.issues++;\n        contributions.push({\n          title: `${event.payload.action} issue: ${event.payload.issue.title}`,\n          description: event.payload.issue.body?.substring(0, 150) || 'Issue',\n          date: event.created_at.split('T')[0],\n\
        \          url: event.payload.issue.html_url,\n          type: 'issue'\n        });\n      } else if (event.type === 'PullRequestReviewEvent') {\n        stats.reviews++;\n        contributions.push({\n          title: `Reviewed PR: ${event.payload.pull_request.title}`,\n          description: 'Pull request review',\n          date: event.created_at.split('T')[0],\n          url: event.payload.pull_request.html_url,\n          type: 'review'\n        });\n      }\n    });\n\n    // Sort by date and limit\n    contributions.sort((a, b) => new Date(b.date) - new Date(a.date));\n    const limitedContributions = contributions.slice(0, 20);\n\n    const output = {\n      stats,\n      contributions: limitedContributions,\n      lastUpdated: new Date().toISOString()\n    };\n\n    fs.writeFileSync('public/data/github-contributions.json', JSON.stringify(output, null, 2));\n    console.log('GitHub data updated successfully!');\n    console.log('Stats:', stats);\n  } catch (error) {\n   \
        \ console.error('Error fetching GitHub data:', error);\n    // Keep existing data on error\n  }\n}\n\nfetchData();\nEOF\n\n# Run the script\nnode scripts/fetch-github-data.js\n"
    - name: Commit updated data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add public/data/github-contributions.json
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update GitHub contributions data [skip ci]"
          git push
        fi
