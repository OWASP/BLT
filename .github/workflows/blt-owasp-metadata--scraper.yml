# Ported from blt-owasp-metadata/.github/workflows/scraper.yml (runs inside blt-owasp-metadata/)
name: 'blt-owasp-metadata: Update Metadata Dataset'
on:
  workflow_dispatch: null
  schedule:
  - cron: 0 3 * * 1
permissions:
  contents: write
defaults:
  run:
    working-directory: blt-owasp-metadata
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run metadata scraper
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python scripts/scrape_metadata.py
    - name: Commit & push updated data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add public/data -A || true
        git diff --staged --quiet || git commit -m "Update metadata dataset"
        git push
