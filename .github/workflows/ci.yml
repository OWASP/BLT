name: CI

# Tests only the project folders a push or pull request touches.
# Per-project test commands live in scripts/ci/tests.tsv.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      projects:
        description: "Space-separated projects to test, or 'all'"
        default: all

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          INPUT_PROJECTS: ${{ github.event.inputs.projects }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all=$(grep -v '^#' scripts/ci/tests.tsv | cut -f1)
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$INPUT_PROJECTS" = all ] && picked="$all" || picked="$INPUT_PROJECTS"
          elif [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            picked="$all"
          else
            changed=$(git diff --name-only "$BASE_SHA" HEAD | cut -d/ -f1 | sort -u)
            picked=""
            for p in $all; do echo "$changed" | grep -qx "$p" && picked="$picked $p"; done
          fi
          rows=""
          for p in $picked; do
            tool=$(awk -F'\t' -v p="$p" '$1==p {print $2}' scripts/ci/tests.tsv)
            [ -n "$tool" ] && rows="$rows{\"project\":\"$p\",\"tool\":\"$tool\"},"
          done
          echo "matrix={\"include\":[${rows%,}]}" >> "$GITHUB_OUTPUT"
          echo "Testing: ${picked:-nothing}"

  test:
    needs: changes
    if: ${{ needs.changes.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    name: test (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v4
      - if: matrix.tool == 'node' || matrix.project == 'blt-safecloak'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.tool == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.project == 'blt-mcp' && '3.12' || matrix.project == 'blt-core' && '3.11.2' || '3.13' }}
      - if: matrix.tool == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - if: matrix.project == 'blt-core'
        run: sudo apt-get update && sudo apt-get install -y xvfb chromium-browser chromium-chromedriver libmemcached-dev
      - run: scripts/ci/test.sh "${{ matrix.project }}"
