# Ported from blt-hackathons/.github/workflows/update-stats.yml (runs inside blt-hackathons/)
name: 'blt-hackathons: Update Statistics and Deploy Pages'
on:
  push:
    branches:
    - main
    paths:
    - blt-hackathons/**
  schedule:
  - cron: 0 * * * *
  workflow_dispatch: null
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    working-directory: blt-hackathons
jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Python dependencies
      run: pip install -r requirements.txt
    - name: Parse hackathons config
      run: node scripts/parse_hackathons_config.js
    - name: Fetch and update statistics
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HACKATHONS_CONFIG_PATH: /tmp/hackathons-config-parsed.json
        UPDATE_HACKATHONS_STARTING_THROUGH: 2026-05-31 23:59:59+00:00
      run: python fetch_stats.py
    - name: Commit and push if changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add public/stats.json public/hackathon-data/
        git diff --staged --quiet || git commit -m "Update statistics [skip ci]"
        git push
      continue-on-error: true
