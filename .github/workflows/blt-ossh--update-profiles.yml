# Ported from blt-ossh/.github/workflows/update-profiles.yml (runs inside blt-ossh/)
name: 'blt-ossh: Update Profiles'
on:
  schedule:
  - cron: 0 */6 * * *
  issues:
    types:
    - opened
    - labeled
    - closed
    - reopened
    - edited
  workflow_dispatch: null
permissions:
  contents: write
  issues: read
defaults:
  run:
    working-directory: blt-ossh
jobs:
  update-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Generate profiles data
      uses: actions/github-script@v7
      with:
        script: "const fs = require('fs');\n\n// Fetch all issues labelled \"profile\" (paginate through all pages)\nconst issues = await github.paginate(\n  github.rest.issues.listForRepo,\n  {\n    owner: context.repo.owner,\n    repo:  context.repo.repo,\n    labels: 'profile',\n    state:  'open',\n    per_page: 100,\n  }\n);\n\n// Filter out PRs (GitHub returns PRs in the issues endpoint)\nconst profileIssues = issues.filter(i => !i.pull_request);\n\n// Helper to extract field from issue body\nfunction extractField(body, fieldName) {\n  const regex = new RegExp(`### ${fieldName}\\\\s*\\\\n\\\\s*(.+?)(?=\\\\n###|$)`, 's');\n  const match = body.match(regex);\n  if (!match) return null;\n  const value = match[1].trim();\n  // GitHub Forms puts \"_No response_\" for empty optional fields\n  return (value === '_No response_' || value === '') ? null : value;\n}\n\n// Helper to extract checkboxes\nfunction extractCheckboxes(body, fieldName) {\n  const regex = new RegExp(`### ${fieldName}[\\\
          \\s\\\\S]*?(?=\\\\n###|$)`, 's');\n  const section = body.match(regex);\n  if (!section) return [];\n  \n  const checkedItems = [];\n  const lines = section[0].split('\\\\n');\n  for (const line of lines) {\n    const match = line.match(/- \\[x\\]\\s*(.+)/i);\n    if (match) checkedItems.push(match[1].trim());\n  }\n  return checkedItems;\n}\n\n// Parse each profile issue\nconst profiles = profileIssues.map(issue => {\n  const body = issue.body || '';\n  \n  // Extract GitHub username\n  const githubUsername = extractField(body, 'GitHub Username');\n  const displayName = extractField(body, 'Display Name') || githubUsername;\n  \n  return {\n    id: issue.number,\n    github_username: githubUsername,\n    display_name: displayName,\n    bio: extractField(body, 'Bio'),\n    avatar_url: `https://github.com/${githubUsername}.png`,\n    experience_level: extractField(body, 'Experience Level'),\n    interests: extractCheckboxes(body, 'Areas of Interest'),\n    skills: (extractField(body,\
          \ 'Skills & Technologies') || '')\n      .split(',')\n      .map(s => s.trim())\n      .filter(Boolean),\n    looking_for: extractField(body, 'What are you looking for\\\\?'),\n    location: extractField(body, 'Location \\\\(Optional\\\\)'),\n    website: extractField(body, 'Website/Portfolio \\\\(Optional\\\\)'),\n    twitter: extractField(body, 'Twitter/X Handle \\\\(Optional\\\\)'),\n    linkedin: extractField(body, 'LinkedIn Profile \\\\(Optional\\\\)'),\n    recommended_projects: extractField(body, 'Recommended Projects \\\\(Optional\\\\)'),\n    recommended_communities: extractField(body, 'Recommended Communities \\\\(Optional\\\\)'),\n    recommended_reading: extractField(body, 'Recommended Reading \\\\(Optional\\\\)'),\n    created_at: issue.created_at,\n    updated_at: issue.updated_at,\n    url: issue.html_url\n  };\n}).filter(profile => profile.github_username); // Only include valid profiles\n\nconst payload = {\n  updated_at: new Date().toISOString(),\n  total_profiles:\
          \ profiles.length,\n  profiles: profiles\n};\n\nfs.mkdirSync('public/data', { recursive: true });\nfs.writeFileSync(\n  'public/data/profiles.json',\n  JSON.stringify(payload, null, 2) + '\\\\n'\n);\n\nconsole.log(`Profiles updated: ${profiles.length} developer profiles`);\n"
    - name: Commit updated profiles
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name  "github-actions[bot]"
        git add public/data/profiles.json
        # Only commit if there are actual changes
        git diff --staged --quiet || \
          git commit -m "chore: update profiles data [skip ci]"
        git push
