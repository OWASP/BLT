name = "blt-monitor"
main = "worker.py"
compatibility_date = "2026-06-07"
compatibility_flags = [ "python_workers", "disable_python_external_sdk" ]

[[kv_namespaces]]
binding = "blt-monitor-history"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [ "/api/*", "/__scheduled" ]

# Cron ("*/5 * * * *") now runs from the blt-cron dispatcher Worker, which calls
# POST /__scheduled through a service binding with the CRON_SECRET secret.
# The empty list makes deploys remove the old trigger (free plan: 5 per account).
[triggers]
crons = []


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
