name = "blt-monitor"
main = "worker.py"
compatibility_date = "2026-05-30"
compatibility_flags = [ "python_workers", "disable_python_external_sdk" ]

[[kv_namespaces]]
binding = "blt-monitor-history"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [ "/api/*" ]

[triggers]
crons = [ "* * * * *" ]
