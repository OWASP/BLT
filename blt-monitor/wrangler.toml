name = "blt-monitor"
main = "worker.py"
compatibility_date = "2026-05-30"
compatibility_flags = [ "python_workers", "disable_python_external_sdk" ]

[[kv_namespaces]]
binding = "blt-monitor-history"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [ "/api/*" ]

[triggers]
crons = [ "*/5 * * * *" ]


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
