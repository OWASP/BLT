<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLT Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-[#0a0f1e] text-[#e2e8f0] m-0 p-0">

<nav class="bg-[#0f172a] border-b border-slate-800 px-4 sm:px-6 py-3 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 mt-3 mb-4 flex items-center justify-between">
    <div class="flex items-center gap-2 font-bold text-lg">
      <img src="https://api.owaspblt.org/logo.png" class="w-[30px]" alt="BLT"/>
      <span class="text-[#e2e8f0]"><span class="text-red-500">BLT</span> Monitor</span>
    </div>
    <div class="flex items-center gap-3">
      <a href="https://gitlab.com/owasp-blt/blt-monitor" target="_blank" rel="noopener noreferrer"
         class="flex items-center gap-1.5 text-sm bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg transition-colors font-medium">
        <i class="fa-brands fa-gitlab"></i>
        <span>GitLab</span>
      </a>
    </div>
  </div>
</nav>

<div class="max-w-7xl mx-auto p-4 sm:p-6 my-2 sm:my-6">

  <!-- Header Card -->
  <div class="bg-[#0f172a] border border-slate-800 rounded-2xl p-5 sm:p-7 mb-6 relative overflow-hidden">
    <!-- subtle red glow top-left -->
    <div class="absolute -top-10 -left-10 w-48 h-48 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>
    <h1 class="text-2xl sm:text-3xl font-bold flex items-center gap-2.5 mb-1.5 relative z-10">
      <i class="fa-solid fa-globe text-red-500"></i>
      <span>Website Monitors</span>
    </h1>
    <p class="text-slate-400 text-sm sm:text-base mb-4 relative z-10">Monitor multiple websites and view their uptime status at a glance</p>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4 relative z-10">
      <div class="bg-slate-900/70 border border-slate-700 rounded-lg px-3 py-2">
        <div class="text-xs text-slate-500">Loaded</div>
        <div id="loaded-count" class="font-bold text-slate-200">0</div>
      </div>
      <div class="bg-green-900/30 border border-green-800 rounded-lg px-3 py-2">
        <div class="text-xs text-green-400">Up</div>
        <div id="up-count" class="font-bold text-green-300">0</div>
      </div>
      <div class="bg-red-900/30 border border-red-800 rounded-lg px-3 py-2">
        <div class="text-xs text-red-400">Down</div>
        <div id="down-count" class="font-bold text-red-300">0</div>
      </div>
      <div class="bg-yellow-900/30 border border-yellow-800 rounded-lg px-3 py-2">
        <div class="text-xs text-yellow-400">Warning</div>
        <div id="warning-count" class="font-bold text-yellow-300">0</div>
      </div>
    </div>
    <div class="grid sm:grid-cols-[1fr_auto_auto] gap-2 relative z-10">
      <label class="relative">
        <span class="sr-only">Search monitors</span>
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
        <input id="monitor-search" type="search" placeholder="Search monitors..."
               class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 pl-9 pr-3 text-sm text-slate-200 placeholder:text-slate-500 focus:outline-none focus:border-red-500">
      </label>
      <label>
        <span class="sr-only">Filter by status</span>
        <select id="status-filter" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-red-500">
          <option value="all">All statuses</option>
          <option value="up">Up</option>
          <option value="down">Down</option>
          <option value="warning">Warning</option>
          <option value="unknown">Unknown</option>
          <option value="disabled">Disabled</option>
        </select>
      </label>
      <label>
        <span class="sr-only">Sort monitors</span>
        <select id="sort-order" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-red-500">
          <option value="configured">Configured order</option>
          <option value="status">Status</option>
          <option value="name">Name</option>
          <option value="response">Response time</option>
        </select>
      </label>
    </div>
  </div>

  <!-- Monitor Cards -->
  <div id="monitors-list" class="space-y-3">
    <!-- Monitor cards will be inserted here -->
  </div>
</div>

<script>
  // sanitizeId: stable ID for routing + KV keys (must match monitor.html)
  function sanitizeId(id) {
    const cleaned = String(id || '').toLowerCase().replace(/[^a-z0-9-_]/g, '');
    return cleaned || 'monitor';
  }

  function toRows(entries) {
    return entries.map(entry => [
      entry.datetime,
      entry.duration_ms,
      entry.status,
      entry.keyword_status
    ]);
  }

  function escapeHTML(str) {
    // null-safe escapeHTML
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function safeUrl(url) {
    try {
      const u = new URL(url);
      return (u.protocol === 'http:' || u.protocol === 'https:') ? url : '#';
    } catch (e) { return '#'; }
  }

  function timeAgo(date) {
    const seconds = Math.floor((new Date() - date) / 1000);
    if (seconds < 60) return `${seconds}s ago`;
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    return `${Math.floor(hours / 24)}d ago`;
  }

  const monitorCards = [];
  const statusOrder = { down: 0, warning: 1, unknown: 2, disabled: 3, up: 4 };

  document.getElementById('monitor-search').addEventListener('input', renderCards);
  document.getElementById('status-filter').addEventListener('change', renderCards);
  document.getElementById('sort-order').addEventListener('change', renderCards);

  function registerCard(card) {
    monitorCards.push(card);
    renderCards();
  }

  function renderCards() {
    const container = document.getElementById('monitors-list');
    const search = document.getElementById('monitor-search').value.trim().toLowerCase();
    const statusFilter = document.getElementById('status-filter').value;
    const sortOrder = document.getElementById('sort-order').value;

    const cards = monitorCards
      .filter(card => (!search || card.dataset.search.includes(search))
        && (statusFilter === 'all' || card.dataset.status === statusFilter))
      .sort((a, b) => {
        if (sortOrder === 'status') {
          return statusOrder[a.dataset.status] - statusOrder[b.dataset.status]
            || Number(a.dataset.index) - Number(b.dataset.index);
        }
        if (sortOrder === 'name') return a.dataset.name.localeCompare(b.dataset.name);
        if (sortOrder === 'response') {
          return Number(a.dataset.responseMs) - Number(b.dataset.responseMs)
            || Number(a.dataset.index) - Number(b.dataset.index);
        }
        return Number(a.dataset.index) - Number(b.dataset.index);
      });

    container.replaceChildren(...cards);
    document.getElementById('loaded-count').textContent = monitorCards.length;
    document.getElementById('up-count').textContent = monitorCards.filter(card => card.dataset.status === 'up').length;
    document.getElementById('down-count').textContent = monitorCards.filter(card => card.dataset.status === 'down').length;
    document.getElementById('warning-count').textContent = monitorCards.filter(card => card.dataset.status === 'warning').length;
  }

  fetch('monitors.json')
    .then(r => {
      if (!r.ok) throw new Error('Failed to fetch monitors.json');
      return r.json();
    })
    .then(monitors => {
      return fetch('/api/histories')
        .then(r => {
          if (!r.ok) throw new Error(`History fetch failed: ${r.status} ${r.statusText}`);
          return r.json();
        })
        .catch(err => {
          console.error('Failed to load monitor history:', err);
          return {};
        })
        .then(histories => {
          monitors.forEach((monitor, index) => {
            const safeId = sanitizeId(monitor.id);          // used for routing & KV keys — must stay stable
            const domSafeId = `${safeId}-${index}`;        // DOM-only: guarantees unique canvas/element IDs
            const rows = toRows(histories[safeId] || []);
            const lastRow = rows.length > 0 ? rows[rows.length - 1] : null;
            registerCard(createMonitorCard(monitor, safeId, domSafeId, rows, lastRow, index));
          });
        });
    })
    .catch(err => {
      console.error('Failed to load monitors configuration:', err);
      document.getElementById('monitors-list').innerHTML =
        '<div class="bg-red-900/30 text-red-300 border border-red-800 rounded-xl p-4 text-center">Failed to load monitors configuration</div>';
    });

  function createMonitorCard(monitor, safeId, domSafeId, rows, lastRow, index) {
    const card = document.createElement('div');
    card.onclick = () => { window.location.href = `monitor.html?id=${safeId}`; };
    card.onkeydown = (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target === card) { e.preventDefault(); window.location.href = `monitor.html?id=${safeId}`; } };
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'link');
    card.setAttribute('aria-label', `View details for ${monitor.name}`);

    let statusBadgeClass = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700';
    let statusIcon = '<i class="fa-solid fa-question"></i> Unknown';
    let responseTime = '--';
    let lastCheck = 'Never';
    let status = 'unknown';
    let cardBorderClass = 'border-slate-800';
    let responseMs = Number.MAX_SAFE_INTEGER;

    if (monitor.enabled === false) {
      status = 'disabled';
      statusIcon = '<i class="fa-solid fa-pause"></i> Disabled';
    } else if (lastRow) {
      const isSuccess = lastRow[2] === 'success';
      const keywordFound = lastRow[3] === 'found';
      status = (isSuccess && keywordFound) ? 'up' : (isSuccess ? 'warning' : 'down');

      if (status === 'up') {
        cardBorderClass = 'border-green-600 ring-1 ring-green-600/60';
        statusBadgeClass = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-green-900/50 text-green-300 border border-green-800';
        statusIcon = '<i class="fa-solid fa-circle-check"></i> Up';
      } else if (status === 'warning') {
        cardBorderClass = 'border-yellow-700 ring-1 ring-yellow-700/50';
        statusBadgeClass = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-yellow-900/50 text-yellow-300 border border-yellow-800';
        statusIcon = '<i class="fa-solid fa-triangle-exclamation"></i> Warning';
      } else if (status === 'down') {
        cardBorderClass = 'border-red-600 ring-1 ring-red-600/60';
        statusBadgeClass = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-red-900/50 text-red-300 border border-red-800';
        statusIcon = '<i class="fa-solid fa-circle-xmark"></i> Down';
      }

      const ms = parseInt(lastRow[1]);
      responseMs = isNaN(ms) ? Number.MAX_SAFE_INTEGER : ms;
      responseTime = isNaN(ms) ? '--' : ms.toLocaleString() + ' ms';

      //guard against invalid date before calling timeAgo
      const checkDate = new Date(lastRow[0]);
      lastCheck = isNaN(checkDate.getTime()) ? 'Unknown' : timeAgo(checkDate);
    }

    card.className = `block bg-[#0f172a] border ${cardBorderClass} rounded-xl p-4 sm:p-5 cursor-pointer focus:outline-none focus:ring-1 focus:ring-red-500`;
    card.dataset.index = index;
    card.dataset.name = String(monitor.name || '').toLowerCase();
    card.dataset.search = `${monitor.name || ''} ${monitor.url || ''} ${monitor.keyword || ''}`.toLowerCase();
    card.dataset.status = status;
    card.dataset.responseMs = responseMs;

    const canvasId = `chart-${domSafeId}`;

    card.innerHTML = `
      <div class="flex items-start gap-4">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <h2 class="text-base sm:text-lg font-bold text-[#e2e8f0] truncate">${escapeHTML(monitor.name)}</h2>
            <span class="${statusBadgeClass}">${statusIcon}</span>
          </div>
          <div class="flex items-center gap-1.5 text-sm text-slate-500 mt-1">
            <i class="fa-solid fa-link flex-shrink-0 text-slate-600"></i>
            <span class="truncate max-w-[300px]" title="${escapeHTML(monitor.url)}">${escapeHTML(monitor.url)}</span>
          </div>
          <div class="flex items-center gap-2 flex-wrap mt-2.5">
            <a href="${escapeHTML(safeUrl(monitor.url))}" target="_blank" rel="noopener noreferrer"
               onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"
               class="flex-shrink-0 inline-flex items-center gap-1 px-2.5 py-0.5 rounded text-white bg-red-600 hover:bg-red-700 text-xs font-medium transition-colors"
               title="Open in new window">
              <i class="fa-solid fa-arrow-up-right-from-square"></i> Open
            </a>
            <span class="flex items-center gap-1 bg-teal-900/40 text-teal-300 px-2.5 py-0.5 rounded-full text-xs border border-teal-800/60">
              <i class="fa-solid fa-clock"></i> ${responseTime}
            </span>
            <span class="flex items-center gap-1 bg-orange-900/40 text-orange-300 px-2.5 py-0.5 rounded-full text-xs border border-orange-800/60">
              <i class="fa-solid fa-calendar"></i> ${lastCheck}
            </span>
            ${monitor.keyword ? `
            <span class="flex items-center gap-1 text-xs text-slate-500">
              <i class="fa-solid fa-magnifying-glass"></i> keyword: <strong class="text-slate-300">${escapeHTML(monitor.keyword)}</strong>
            </span>` : ''}
          </div>
        </div>
        <div class="w-40 sm:w-48 h-16 sm:h-20 flex-shrink-0">
          <canvas id="${canvasId}"></canvas>
        </div>
      </div>
    `;

    setTimeout(() => {
      if (rows.length > 0) drawSparkline(canvasId, rows);
    }, 10);

    return card;
  }

  function drawSparkline(canvasId, rows) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    // filter out NaN response times before charting
    const recentRows = rows.slice(-20).filter(r => !isNaN(parseInt(r[1])));
    const data = recentRows.map(r => parseInt(r[1]));
    const bgColors = recentRows.map(r =>
      (r[2] === 'success' && r[3] === 'found') ? '#4CAF50' :
      (r[2] === 'success' ? '#FFC107' : '#f44336')
    );

    if (data.length === 0) return;

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: data.map((_, i) => i),
        datasets: [{
          data,
          fill: true,
          borderColor: '#2dd4bf',
          backgroundColor: 'rgba(45, 212, 191, 0.12)',
          pointBackgroundColor: bgColors,
          pointBorderColor: 'rgba(0,0,0,0.4)',
          pointBorderWidth: 1,
          pointRadius: 3,
          pointHoverRadius: 5,
          tension: 0.4,
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          y: { display: false, beginAtZero: true },
          x: { display: false }
        }
      }
    });
  }

</script>
</body>
</html>
