name = "blt-sammich"
main = "src/worker.py"
compatibility_date = "2026-03-22"
compatibility_flags = ["python_workers"]
workers_dev = false
preview_urls = false

[vars]
APP_VERSION = "0.1.0"

[build]
command = "./script/migrate.sh"

# Bundle src/data (welcome and channel-join .md templates, projects.json, repos.json) as text
# modules. Python Workers only bundle .py/.txt/.html/... by default, so without this rule the
# deployed Worker had none of them. tests/test_packaged_data.py checks every file is covered.
[[rules]]
type = "Text"
globs = ["**/*.md", "**/*.json"]
fallthrough = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/slack/*", "/oauth/*", "/api/*", "/health", "/logo-hit", "/admin-*", "/__scheduled"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "blt-sammich"
database_id = "409b2fbf-ee3d-4204-a65d-c6994861a8ce"
migrations_dir = "migrations"

# No cron trigger of its own: the blt-cron Worker calls POST /__scheduled every 5 minutes
# (:04, :09, ...) to send due /setreminder reminders, authenticated with the CRON_SECRET
# secret (npx wrangler secret put CRON_SECRET, the same value as on blt-cron).
