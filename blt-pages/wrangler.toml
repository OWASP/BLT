# Static site (public/) plus a Worker (worker/index.js) that serves the leaderboard pages and data
# from KV (binding DATA). .forkmesh/blt-pages--update-leaderboard.yml writes those keys; nothing is
# committed to git.
name = "blt-pages"
main = "worker/index.js"
compatibility_date = "2026-06-06"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/leaderboard", "/leaderboard.html", "/data/leaderboard.json", "/data/leaders.json"]

# Created by scripts/worker-data/create-kv.sh, which replaces the placeholder id.
[[kv_namespaces]]
binding = "DATA"
id = "2a247449e2b547e4b1de7d075417fd4a"
