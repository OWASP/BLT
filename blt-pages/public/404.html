<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="This page does not exist on OWASP BLT. Head back to the homepage or report a bug." />
  <title>404 – Page Not Found · OWASP BLT</title>
  <link rel="icon" href="/static/blt-logo.svg" type="image/svg+xml" />

  <script>
    (function() {
      try {
        var saved = (localStorage.getItem('theme') || localStorage.getItem('blt-theme'));
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <script src="https://owaspblt.org/_shared/blt-nav.js" defer></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#dc2626',
            'primary-hover': '#B91C1C',
            'neutral-border': '#e5e7eb',
            'dark-base': '#030712',
            'dark-surface': '#111827',
            'active-bg': '#fef2f2'
          },
          fontFamily: {
            sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif']
          },
          boxShadow: {
            soft: '0 14px 40px -28px rgba(17, 24, 39, 0.35)'
          }
        }
      }
    };
  </script>

  <style>
    .fa-icon { display: inline-block; height: 1em; width: auto; aspect-ratio: 1; vertical-align: -0.125em; fill: currentColor; overflow: visible; }
    :root {
      --blt-primary: #dc2626;
      --blt-border: #e5e7eb;
      --blt-surface: #ffffff;
      --blt-background: #f9fafb;
    }

    .dark {
      --blt-primary: #f87171;
      --blt-border: #1f2937;
      --blt-surface: #111827;
      --blt-background: #030712;
    }

    body {
      background: var(--blt-background);
      transition: background-color 0.3s ease;
    }
    blt-nav:not(:defined) { display: block; min-height: 61px; }
    blt-nav:not(:defined) > * { display: none; }
  </style>
</head>

<body class="flex min-h-screen flex-col font-sans text-gray-900 antialiased dark:bg-dark-base dark:text-gray-100">
  <svg xmlns="http://www.w3.org/2000/svg" class="hidden" aria-hidden="true">
    <symbol id="fa-bug" viewBox="0 0 576 512">
    <path fill="currentColor" d="M192 96c0-53 43-96 96-96s96 43 96 96l0 3.6c0 15.7-12.7 28.4-28.4 28.4l-135.1 0c-15.7 0-28.4-12.7-28.4-28.4l0-3.6zm345.6 12.8c10.6 14.1 7.7 34.2-6.4 44.8l-97.8 73.3c5.3 8.9 9.3 18.7 11.8 29.1l98.8 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-96 0 0 32c0 2.6-.1 5.3-.2 7.9l83.4 62.5c14.1 10.6 17 30.7 6.4 44.8s-30.7 17-44.8 6.4l-63.1-47.3c-23.2 44.2-66.5 76.2-117.7 83.9L312 280c0-13.3-10.7-24-24-24s-24 10.7-24 24l0 230.2c-51.2-7.7-94.5-39.7-117.7-83.9L83.2 473.6c-14.1 10.6-34.2 7.7-44.8-6.4s-7.7-34.2 6.4-44.8l83.4-62.5c-.1-2.6-.2-5.2-.2-7.9l0-32-96 0c-17.7 0-32-14.3-32-32s14.3-32 32-32l98.8 0c2.5-10.4 6.5-20.2 11.8-29.1L44.8 153.6c-14.1-10.6-17-30.7-6.4-44.8s30.7-17 44.8-6.4L192 184c12.3-5.1 25.8-8 40-8l112 0c14.2 0 27.7 2.8 40 8l108.8-81.6c14.1-10.6 34.2-7.7 44.8 6.4z"/>
  </symbol>
    <symbol id="fa-house" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></symbol>
  </svg>

  <blt-nav project="blt-pages" name="Pages" current="auto" data-sticky>
    <a href="/#features">Features</a>
    <a href="/#how-it-works">How it works</a>
    <a href="/leaderboard.html">Leaderboard</a>
    <a href="/leaders.html">Leaders</a>
    <a href="https://git.owaspblt.org/BLT/tree/main/blt-pages" target="_blank" rel="noopener noreferrer">Source</a>
    <a href="https://git.owaspblt.org/BLT/issues/new" slot="actions" data-primary target="_blank" rel="noopener noreferrer">Report Bug</a>
  </blt-nav>

  <!-- Main 404 content -->
  <main class="flex flex-1 items-center justify-center py-20 px-4">
    <div class="mx-auto max-w-lg text-center">
      <!-- Big 404 number -->
      <p class="text-[9rem] font-extrabold leading-none tracking-tight text-primary/20 dark:text-red-500/20 select-none" aria-hidden="true">404</p>

      <!-- Icon -->
      <div class="mx-auto -mt-6 mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-active-bg dark:bg-red-950/30">
        <svg class="fa-icon text-2xl text-primary dark:text-red-400" aria-hidden="true"><use href="#fa-bug"></use></svg>
      </div>

      <h1 class="mb-3 text-3xl font-extrabold text-gray-900 dark:text-gray-100 sm:text-4xl">Page not found</h1>
      <p class="mb-8 text-base leading-relaxed text-gray-500 dark:text-gray-400">
        Looks like this page has a bug — or it never existed.<br />
        Let's get you back on track.
      </p>

      <!-- Action buttons -->
      <div class="flex flex-col items-center gap-3 sm:flex-row sm:justify-center">
        <a
          href="/"
          class="inline-flex w-full items-center justify-center rounded-lg bg-primary px-6 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-primary-hover focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary sm:w-auto"
        >
          <svg class="fa-icon mr-2 text-xs" aria-hidden="true"><use href="#fa-house"></use></svg>Go to Homepage
        </a>
        <a
          href="https://git.owaspblt.org/BLT/issues/new" target="_blank" rel="noopener noreferrer"
          class="inline-flex w-full items-center justify-center rounded-lg border border-neutral-border bg-white px-6 py-3 text-sm font-bold text-gray-700 shadow-sm transition hover:border-primary hover:text-primary dark:border-gray-700 dark:bg-dark-surface dark:text-gray-300 dark:hover:border-red-500 dark:hover:text-red-400 sm:w-auto"
        >
          <svg class="fa-icon mr-2 text-xs" aria-hidden="true"><use href="#fa-bug"></use></svg>Report a Bug
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-neutral-border bg-white dark:border-gray-800 dark:bg-dark-surface">
    <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-3 px-4 py-6 sm:flex-row sm:px-6 lg:px-8">
      <p class="text-xs text-gray-400 dark:text-gray-500">&copy; <span id="footer-year"></span> OWASP Foundation and BLT Contributors · AGPLv3</p>
      <a href="/" class="text-xs text-red-600 hover:underline dark:text-red-400">Back to OWASP BLT</a>
    </div>
  </footer>

  <script>
    // Footer year
    document.getElementById('footer-year').textContent = new Date().getFullYear();

    // Theme toggle: the shared <blt-nav> bar; the pre-paint script in <head> applies the saved choice.
    window.addEventListener('blt-theme-change', function (e) {
      if (typeof bltCapture === 'function') {
        bltCapture('dark_mode_toggled', { to_dark: !!(e.detail && e.detail.dark), page: '404' });
      }
    });
  </script>
  <script src="/js/config.js"></script>
  <script src="/js/analytics.js"></script>
  <!-- These synchronous scripts execute in order, so bltCapture is available here.
       The dark_mode_toggled call above is inside a click handler so it also only
       runs after analytics.js has been parsed and executed. -->
  <script>
    bltCapture('page_not_found', { path: window.location.pathname });
  </script>
</body>
</html>
