# Static site (public/) plus a Worker (worker/index.js) that serves the generated page (/ and
# /index.html) and /project_repos_links.json from KV (binding DATA). The workflow
# .forkmesh/blt-tomato--scrape_funding.yml (weekly) writes them; nothing is committed to git.
name = "blt-tomato"
main = "worker/index.js"
compatibility_date = "2026-06-06"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/project_repos_links.json"]

# Created by scripts/worker-data/create-kv.sh, which replaces the placeholder id.
[[kv_namespaces]]
binding = "DATA"
id = "66c6ad591bb24cf6868fc30726e5243c"
