name = "blt-dash"
main = "src/index.py"
compatibility_date = "2025-04-22"
compatibility_flags = ["python_workers"]

[vars]
ENVIRONMENT = "production"

# Configure assets (static files)
[assets]
directory = "./public"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1