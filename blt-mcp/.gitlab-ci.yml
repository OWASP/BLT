# Not run anywhere: this repository runs .forkmesh/ workflows (see docs/workflows.md).
# Jobs already ported to .forkmesh/ or scripts/ci/tests.tsv were removed; these remain for reference.
# The Rust build and release jobs pointed at blt-cli/, which is its own project now.

stages:
  - snapshot-verify

golden-snapshot-verify:
  stage: snapshot-verify
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
  variables:
    UV_CACHE_DIR: ".uv-cache"
    BLT_VERIFY_SNAPSHOTS: "true"
    BLT_API_KEY: "f5537412b459790f9fa1cc47b862b9c7016471957178dc9b161d59355b6fd051"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR
  script:
    - uv sync --locked --all-extras
    - uv run --locked pytest tests/
