# ==========================================
# 3. Deploy Stage (Upload Artifacts/Packages)
# ==========================================

upload-release-assets:
  stage: deploy
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      for FILE in bin/*; do
        FILENAME=$(basename "$FILE")
        echo "Uploading $FILENAME to generic package registry..."
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$FILE" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/blt-cli/${CI_COMMIT_TAG}/${FILENAME}"
      done

upload-nightly-assets:
  stage: deploy
  image: curlimages/curl:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      for FILE in bin/*; do
        FILENAME=$(basename "$FILE")
        echo "Uploading nightly $FILENAME to generic package registry..."
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$FILE" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/blt-cli/nightly/${FILENAME}"
      done

# ==========================================
# 4. Release Stage (Official Version Release)
# ==========================================

create-gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release for tag $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Automated release of version $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'blt-cli-linux-x86_64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/blt-cli/${CI_COMMIT_TAG}/blt-cli-linux-x86_64'
        - name: 'blt-cli-linux-aarch64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/blt-cli/${CI_COMMIT_TAG}/blt-cli-linux-aarch64'
        # macOS binaries are commented out as macOS builds are not available for now.
        # - name: 'blt-cli-macos-arm64'
        #   url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/blt-cli/${CI_COMMIT_TAG}/blt-cli-macos-arm64'
        # - name: 'blt-cli-macos-x86_64'
        #   url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/blt-cli/${CI_COMMIT_TAG}/blt-cli-macos-x86_64'
        - name: 'blt-cli-windows-x86_64.exe'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/blt-cli/${CI_COMMIT_TAG}/blt-cli-windows-x86_64.exe'
