stages:
  - test
  - build
  - deploy
  - release

# Global workflow rules to prevent duplicate pipelines (e.g., branch and merge request pipelines running concurrently)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ==========================================
# 1. Test Stage (Python & Rust Tests)
# ==========================================

python-tests:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  variables:
    UV_CACHE_DIR: ".uv-cache"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR
  script:
    - uv sync --locked --all-extras
    - uv run --locked pytest tests/

rust-tests-linux:
  stage: test
  image: rust:latest
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key: rust-linux-cache
    paths:
      - .cargo/bin/
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - blt-cli/target/
  script:
    - cd blt-cli
    - cargo check --locked --verbose
    - cargo test --locked --verbose

# ==========================================
# 2. Build Stage (Multi-platform Binaries)
# ==========================================

build-rust-linux-windows:
  stage: build
  image: rust:latest
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key: rust-linux-windows-cache
    paths:
      - .cargo/bin/
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - blt-cli/target/
  before_script:
    - apt-get update && apt-get install -y gcc-aarch64-linux-gnu mingw-w64
    - rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-gnu
  script:
    - cd blt-cli
    # Build Linux x86_64
    - cargo build --locked --release --target x86_64-unknown-linux-gnu
    # Build Linux aarch64
    - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
    - cargo build --locked --release --target aarch64-unknown-linux-gnu
    # Build Windows x86_64
    - cargo build --locked --release --target x86_64-pc-windows-gnu
    # Organize outputs
    - mkdir -p ../bin
    - cp target/x86_64-unknown-linux-gnu/release/blt-cli ../bin/blt-cli-linux-x86_64
    - cp target/aarch64-unknown-linux-gnu/release/blt-cli ../bin/blt-cli-linux-aarch64
    - cp target/x86_64-pc-windows-gnu/release/blt-cli.exe ../bin/blt-cli-windows-x86_64.exe
  artifacts:
    name: "blt-cli-linux-windows-$CI_COMMIT_REF_NAME"
    paths:
      - bin/
    expire_in: 7 days

