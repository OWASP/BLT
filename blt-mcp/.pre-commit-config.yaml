# .pre-commit-config.yaml
# Configuration for automated linting and formatting on Git commits.
# To install:
#   1. Install pre-commit: pip install pre-commit (or uv tool install pre-commit)
#   2. Register hooks: pre-commit install
#   3. (Optional) Run on all files: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=50000'] # Prevents accidentally committing files larger than 50MB (like WSL or VM disks)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Check Rust code formatting
        entry: cargo fmt --manifest-path blt-cli/Cargo.toml -- --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Run clippy lints on Rust code
        entry: cargo clippy --manifest-path blt-cli/Cargo.toml --all-targets
        language: system
        files: \.rs$
        pass_filenames: false
