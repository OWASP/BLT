<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — OWASP BLT</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../assets/img/blt-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          },
          colors: {
            primary: { DEFAULT: '#dc2626', dark: '#b91c1c' },
          },
        },
      },
    };
  </script>
  <script src="../assets/js/theme-init.js"></script>
  <script src="https://owaspblt.org/_shared/blt-nav.js" defer></script>
  <script src="../assets/js/main.js" type="module" defer></script>
  <style>blt-nav:not(:defined) { display: block; min-height: 62px; } blt-nav:not(:defined) > * { display: none; } body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }</style>
</head>

<body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased transition-colors min-h-screen flex flex-col">
  <blt-nav project="blt-next" name="Next" home="../index.html" current="auto" data-sticky>
    <a href="../index.html">Home</a>
    <a href="report-bug.html">Report Bug</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="projects.html">Projects</a>
    <a href="about.html">About</a>
    <a id="loginBtn" href="login.html" slot="actions">Login</a>
    <a id="signupBtn" href="signup.html" slot="actions" data-primary>Sign Up</a>
  </blt-nav>

  <main role="main" class="flex-1 flex items-center justify-center py-16 px-4 sm:px-6">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white mb-2">Create Your Account</h1>
        <p class="text-gray-500 dark:text-gray-400">Join the BLT community today.</p>
      </div>

      <div class="bg-white dark:bg-gray-900 rounded-xl shadow-lg border border-gray-100 dark:border-gray-800 p-6 sm:p-8">
        <form id="signupForm" class="space-y-4">
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Username</label>
            <input id="username" name="username" type="text" required minlength="3" placeholder="johndoe" class="w-full px-3.5 py-2.5 text-sm border border-gray-300 dark:border-gray-700 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-transparent transition-colors" />
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Email Address</label>
            <input id="email" name="email" type="email" required placeholder="you@example.com" class="w-full px-3.5 py-2.5 text-sm border border-gray-300 dark:border-gray-700 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-transparent transition-colors" />
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Password</label>
            <input id="password" name="password" type="password" required minlength="8" placeholder="••••••••" class="w-full px-3.5 py-2.5 text-sm border border-gray-300 dark:border-gray-700 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-transparent transition-colors" />
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Must be at least 8 characters</p>
          </div>

          <div>
            <label for="confirmPassword" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" required minlength="8" placeholder="••••••••" class="w-full px-3.5 py-2.5 text-sm border border-gray-300 dark:border-gray-700 rounded-md bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-transparent transition-colors" />
          </div>

          <div class="flex items-start gap-2">
            <input id="terms" type="checkbox" required class="w-4 h-4 mt-0.5 text-red-600 border-gray-300 rounded focus:ring-red-600" />
            <label for="terms" class="text-xs text-gray-600 dark:text-gray-400">I agree to the <a href="terms.html" class="font-medium text-red-600 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 transition-colors">Terms of Service</a> and <a href="privacy.html" class="font-medium text-red-600 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 transition-colors">Privacy Policy</a></label>
          </div>

          <button type="submit" class="w-full px-4 py-2.5 text-sm font-semibold text-white bg-red-600 rounded-md hover:bg-red-700 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-red-600 focus:ring-offset-2">Create Account</button>
        </form>
      </div>

      <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6">Already have an account? <a href="login.html" class="font-medium text-red-600 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 transition-colors">Sign In</a></p>
    </div>
  </main>

  <div hx-get="../components/footer.html" hx-trigger="load" hx-swap="outerHTML"></div>

</body>
</html>
