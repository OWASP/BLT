<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BLT Newsletter - First Admin Signup</title>
    <meta
      name="description"
      content="Create the first BLT Newsletter admin account after D1 migration."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      * {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      body {
        background:
          radial-gradient(circle at top left, rgba(220, 38, 38, 0.12), transparent 30rem),
          linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        color: #0f172a;
      }

      .setup-card {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      }

      .input-field {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 14px;
        color: #0f172a;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      .input-field:focus {
        outline: none;
        border-color: #dc2626;
        box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
      }

      .btn-primary {
        width: 100%;
        background: linear-gradient(to bottom, #ef4444, #dc2626);
        color: white;
        border-bottom: 1.5px solid #991b1b;
        border-radius: 6px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
        box-shadow: 0 18px 36px -20px rgba(220, 38, 38, 0.9);
      }

      .btn-primary:hover {
        transform: translateY(-1px);
      }

      .btn-primary:disabled {
        cursor: not-allowed;
        opacity: 0.65;
        transform: none;
      }
    </style>
  </head>
  <body class="antialiased">
    <main id="signup-page" class="min-h-screen flex items-center justify-center px-4 py-12">
      <section class="w-full max-w-md">
        <div class="mb-8 text-center">
          <a
            href="/"
            class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-lg border border-red-100 bg-white shadow-sm"
            aria-label="Back to BLT Newsletter home"
          >
            <img src="./static/images/logo.png" alt="BLT Logo" class="h-10 w-10" />
          </a>
          <p class="text-xs font-semibold uppercase tracking-[0.18em] text-red-600">OWASP BLT</p>
          <h1 class="mt-2 text-2xl font-bold text-gray-950">First admin setup</h1>
          <p class="mt-2 text-sm text-gray-600">Create the first admin account after running the D1 migration.</p>
        </div>

        <form class="setup-card p-8" onsubmit="signupFirstAdmin(); return false;">
          <div class="mb-6">
            <h2 class="text-lg font-semibold text-gray-950">Create First admin</h2>
            <p id="setup-status" class="mt-1 text-sm text-gray-500">Checking whether setup is available…</p>
          </div>

          <div class="space-y-4">
            <div>
              <label for="signup-name" class="mb-2 block text-sm font-medium text-gray-700">Name</label>
              <input
                id="signup-name"
                class="input-field"
                type="text"
                placeholder="Local Admin"
                autocomplete="name"
              />
            </div>

            <div>
              <label for="signup-email" class="mb-2 block text-sm font-medium text-gray-700">Email</label>
              <input
                id="signup-email"
                class="input-field"
                type="email"
                placeholder="admin@blt.dev"
                autocomplete="email"
                required
              />
            </div>

            <div>
              <label for="signup-password" class="mb-2 block text-sm font-medium text-gray-700">Password</label>
              <input
                id="signup-password"
                class="input-field"
                type="password"
                placeholder="At least 8 characters"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>

            <div>
              <label for="signup-password-confirm" class="mb-2 block text-sm font-medium text-gray-700">Confirm password</label>
              <input
                id="signup-password-confirm"
                class="input-field"
                type="password"
                placeholder="Repeat password"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>
          </div>

          <p id="signup-error" class="mt-5 hidden rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"></p>
          <p id="signup-success" class="mt-5 hidden rounded-md border border-green-200 bg-green-50 px-3 py-2 text-sm text-green-700"></p>

          <button id="signup-submit" class="btn-primary mt-6" type="submit" disabled>
            Create first admin
          </button>

          <div class="mt-6 flex items-center justify-between text-sm">
            <a href="/" class="font-medium text-gray-500 transition hover:text-gray-900">Home</a>
            <a href="/login" class="font-medium text-red-600 transition hover:text-red-700">Admin login</a>
          </div>
        </form>
      </section>
    </main>

    <script>
      document.addEventListener('DOMContentLoaded', checkSetupStatus);

      async function checkSetupStatus() {
        const submit = document.getElementById('signup-submit');
        const statusEl = document.getElementById('setup-status');
        try {
          const response = await fetch("/api/admin/setup/status", {
            credentials: "same-origin",
          });
          const payload = await response.json();
          if (!response.ok) {
            statusEl.textContent = payload.error || 'Run local D1 migrations before creating the first admin.';
            return;
          }
          if (payload.setup_required === false) {
            window.location.href = '/login';
            return;
          }
          statusEl.textContent = 'No admin exists yet. Create the first maintainer account.';
          submit.disabled = false;
        } catch (error) {
          statusEl.textContent = 'Setup status could not be checked. Make sure Wrangler is running.';
        }
      }

      async function signupFirstAdmin() {
        const errorEl = document.getElementById('signup-error');
        const successEl = document.getElementById('signup-success');
        const submit = document.getElementById('signup-submit');
        const password = document.getElementById('signup-password').value;
        const passwordConfirm = document.getElementById('signup-password-confirm').value;
        errorEl.classList.add('hidden');
        successEl.classList.add('hidden');
        errorEl.textContent = '';
        successEl.textContent = '';

        if (password !== passwordConfirm) {
          errorEl.textContent = 'Passwords do not match.';
          errorEl.classList.remove('hidden');
          return;
        }

        submit.disabled = true;
        try {
          const response = await fetch("/api/admin/setup", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            credentials: "same-origin",
            body: JSON.stringify({
              name: document.getElementById('signup-name').value,
              email: document.getElementById('signup-email').value,
              password,
            }),
          });
          const payload = await response.json();
          if (!response.ok) {
            errorEl.textContent = payload.error || 'First admin could not be created.';
            errorEl.classList.remove('hidden');
            submit.disabled = false;
            if (response.status === 409) window.location.href = '/login';
            return;
          }

          successEl.textContent = 'First admin created. Opening dashboard…';
          successEl.classList.remove('hidden');
          window.location.href = '/dashboard';
        } catch (error) {
          errorEl.textContent = 'Signup failed. Please try again.';
          errorEl.classList.remove('hidden');
          submit.disabled = false;
        }
      }
    </script>
  </body>
</html>
