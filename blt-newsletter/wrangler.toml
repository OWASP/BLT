name = "blt-newsletter"
main = "src/entry.py"
compatibility_date = "2026-06-06"
compatibility_flags = ["python_workers", "disable_python_external_sdk"]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/", "/dashboard", "/dashboard/", "/login", "/login/", "/signup", "/signup/", "/docs", "/docs/", "/api/*"]

[[d1_databases]]
binding = "DB"
# The account is at the free plan's 10-database limit, so the newsletter uses the
# previously empty blt_zero database. Move to a dedicated database when a slot frees up.
database_name = "blt_zero"
database_id = "0fd8d04c-f434-48a1-a5d2-617b49ce79ff"
migrations_dir = "migrations"

[[queues.producers]]
binding = "NEWSLETTER_QUEUE"
queue = "blt-newsletter-send"

[[queues.consumers]]
queue = "blt-newsletter-send"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
