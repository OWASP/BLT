<!DOCTYPE html>
<html>
<head>
    <title>Project Matrix</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="theme-init.js"></script>
    <script src="https://owaspblt.org/_shared/blt-nav.js" defer></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.25/css/jquery.dataTables.min.css">
    <style>
        body {
            margin: 0;
            padding: 10px;
        }

        th {
            position: sticky;
            top: 0;
            background-color: #f1f1f1;
        }
    </style>
    <link rel="stylesheet" href="blt-theme.css">
</head>
<body>
    <table id="projects" class="display">
        <thead>
            <tr>
                <th>Name</th>
                <th>Repo Name</th>
                <th>URL</th>
                <th>Created</th>
                <th>Updated</th>
                <th>Build</th>
                <th>Code URL</th>
                <th>Title</th>
                <th>Level</th>
                <th>Type</th>
                <th>Region</th>
                <th>Pitch</th>
                <th>Meetup Group</th>
                <th>Github Status</th>
                <th>Last Commit</th>
                <th>Date Released</th>
                <th>Release Version</th>
                <th>Committers</th>
                <th>Stars</th>
                <th>Top Language</th>
                <th>License</th>
                <th>Forks</th>
                <th>PRs</th>
                <th>Issues</th>
            </tr>
        </thead>
    </table>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.25/js/jquery.dataTables.min.js"></script>
    <script src="safe-html.js"></script>
    <script>
        // Every field is escaped: DataTables renders cell strings as HTML, and the values come from
        // OWASP project metadata and the GitHub API.
        const TEXT_FIELDS = ["name", "created", "updated", "build", "title", "level", "type", "region",
            "pitch", "meetup-group", "github_status", "last_commit", "date_released", "release_version",
            "committers", "stars", "top_language", "license", "forks", "prs", "issues"];

        function generateProjectData(projects) {
            return projects.map(project => {
                const row = {};
                for (const field of TEXT_FIELDS) row[field] = escapeHtml(project[field]);
                row.repo_name = linkHtml(project.codeurl, project.repo_name);
                row.url = linkHtml(project.url);
                row.codeurl = linkHtml(project.codeurl);
                return row;
            });
        }

        async function loadRepoStatus() {
            const response = await fetch('repo_status.json');
            const projects = await response.json();
            return projects;
        }


        (async function () {
            const projects = await loadRepoStatus();
            const projectsData = generateProjectData(projects);

            $(document).ready(function () {
                $('#projects').DataTable({
                    "data": projectsData,
                    "pageLength": 100,
                    "columns": [
                        { "data": "name" },
                        { "data": "repo_name" },
                        { "data": "url" },
                        { "data": "created" },
                        { "data": "updated" },
                        { "data": "build" },
                        { "data": "codeurl" },
                        { "data": "title" },
                        { "data": "level" },
                        { "data": "type" },
                        { "data": "region" },
                        { "data": "pitch" },
                        { "data": "meetup-group" },
                        { "data": "github_status" },
                        { "data": "last_commit" },
                        { "data": "date_released" },
                        { "data": "release_version" },
                        { "data": "committers" },
                        { "data": "stars" },
                        { "data": "top_language" },
                        { "data": "license" },
                        { "data": "forks" },
                        { "data": "prs" },
                        { "data": "issues" },
                    ],
                    "order": [[0, "asc"]]
                });
            });
        })();
    </script>
</body>
</html>
