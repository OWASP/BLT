# Static site (public/) plus a Worker (worker/index.js) that serves the dashboard data files from KV
# (binding DATA). The workflow .forkmesh/blt-owasp-projects--refresh-data.yml (daily) writes those
# keys; nothing is committed to git.
name = "blt-owasp-projects"
main = "worker/index.js"
compatibility_date = "2026-06-06"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [
  "/www_project_repos.json",
  "/repo_status.json",
  "/issues.json",
  "/known_issue_ids.json",
  "/project_repos_links.json",
]

# Created by scripts/worker-data/create-kv.sh, which replaces the placeholder id.
[[kv_namespaces]]
binding = "DATA"
id = "REPLACE_WITH_KV_ID_blt-owasp-projects-data"
