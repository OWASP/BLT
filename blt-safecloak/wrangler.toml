name = "blt-safecloak"
main = "src/main.py"
compatibility_date = "2024-01-01"
compatibility_flags = ["python_workers"]

[assets]
directory = "./public"

[durable_objects]
bindings = [
  { name = "CHAT_ROOMS", class_name = "ChatRoom" }
]

[[migrations]]
tag = "v1-chat-rooms"
new_sqlite_classes = ["ChatRoom"]

[observability]
enabled = true
