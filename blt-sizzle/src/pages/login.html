<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in | BLT Sizzle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary: #dc2626; --primary-hover: #b91c1c; --surface: #ffffff; --background: #f8fafc; --border: #e2e8f0; }
        * { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .dot-field{background-image:radial-gradient(rgba(17,24,39,.16) 1px,transparent 1px);background-size:18px 18px;mask-image:radial-gradient(circle at center,black 0,transparent 74%);-webkit-mask-image:radial-gradient(circle at center,black 0,transparent 74%)}
        .btn-primary{background:linear-gradient(to bottom,#ef4444,#dc2626);color:white;border-bottom:1.5px solid #991b1b;border-radius:8px;padding:12px 18px;font-weight:600;box-shadow:0 10px 24px -14px rgba(220,38,38,.8);transition:all .2s ease}.btn-primary:hover{transform:translateY(-1px)}
    </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 antialiased">
    <header class="fixed inset-x-0 top-0 z-50 border-b border-black/5 bg-white/90 backdrop-blur-[18px]">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
            <a href="/" class="inline-flex items-center gap-2.5">
                <img src="/assets/images/owasp-blt-logo.svg" alt="OWASP BLT logo" class="h-9 w-9 rounded-lg border border-red-100 bg-white p-1 shadow-sm" />
                <span class="text-sm font-semibold tracking-tight">BLT Sizzle</span>
            </a>
            <a class="rounded-md px-3 py-2 text-sm text-gray-600 transition hover:bg-gray-100 hover:text-gray-900" href="/">Back to landing</a>
        </div>
    </header>

    <main class="relative flex min-h-screen items-center justify-center px-4 py-28">
        <div class="dot-field pointer-events-none absolute inset-x-0 top-20 mx-auto h-[36rem] w-[min(90rem,180vw)] opacity-70" aria-hidden="true"></div>
        <section class="relative z-10 grid w-full max-w-5xl overflow-hidden rounded-3xl border border-gray-200 bg-white shadow-[0_22px_60px_-45px_rgba(15,23,42,.75)] md:grid-cols-[1fr_.9fr]">
            <div class="bg-[#0e0d0c] p-8 text-white md:p-10">
                <span class="inline-flex rounded-full border border-red-400/40 bg-red-500/10 px-3 py-1 font-mono text-xs font-medium uppercase tracking-[.16em] text-red-300">Email verification</span>
                <h1 class="mt-6 text-4xl font-semibold leading-tight tracking-[-.04em] md:text-5xl">Log in with a one-time code.</h1>
                <p class="mt-5 max-w-md text-sm leading-6 text-gray-300">Email-only access for the new Sizzle workflow. Enter your email, verify the OTP we send, and continue to your check-ins and dashboard.</p>
                <div class="mt-8 grid gap-3 text-sm text-gray-300">
                    <div class="rounded-2xl border border-white/10 bg-white/5 p-4"><strong class="text-white">1.</strong> Request verification code</div>
                    <div class="rounded-2xl border border-white/10 bg-white/5 p-4"><strong class="text-white">2.</strong> Verify OTP from email</div>
                    <div class="rounded-2xl border border-white/10 bg-white/5 p-4"><strong class="text-white">3.</strong> Choose org and check in</div>
                </div>
            </div>

            <div class="p-8 md:p-10">
                <div id="message" class="mb-5 hidden rounded-xl border px-4 py-3 text-sm"></div>
                <form id="emailForm" class="space-y-5">
                    <div>
                        <label for="email" class="mb-2 block text-sm font-semibold text-gray-700">Email address</label>
                        <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-gray-900 outline-none transition focus:border-red-500 focus:bg-white" />
                    </div>
                    <button type="submit" class="btn-primary w-full">Send verification code</button>
                </form>

                <form id="otpForm" class="mt-6 hidden space-y-5">
                    <div>
                        <label for="otp" class="mb-2 block text-sm font-semibold text-gray-700">Verification code</label>
                        <input id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="123456" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-center font-mono text-2xl tracking-[.35em] text-gray-900 outline-none transition focus:border-red-500 focus:bg-white" />
                    </div>
                    <button type="submit" class="btn-primary w-full">Verify and continue</button>
                    <button type="button" id="changeEmailBtn" class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm font-semibold text-gray-700 transition hover:bg-gray-50">Use a different email</button>
                </form>
            </div>
        </section>
    </main>

    <script>
        const emailForm = document.getElementById('emailForm');
        const otpForm = document.getElementById('otpForm');
        const emailInput = document.getElementById('email');
        const otpInput = document.getElementById('otp');
        const message = document.getElementById('message');
        const changeEmailBtn = document.getElementById('changeEmailBtn');
        let pendingEmail = '';

        function showMessage(text, type = 'info') {
            message.textContent = text;
            message.className = 'mb-5 rounded-xl border px-4 py-3 text-sm ' + (type === 'error'
                ? 'border-red-200 bg-red-50 text-red-700'
                : 'border-emerald-200 bg-emerald-50 text-emerald-700');
            message.classList.remove('hidden');
        }

        emailForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            pendingEmail = emailInput.value.trim().toLowerCase();
            const res = await fetch('/api/auth/request-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: pendingEmail })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                showMessage(data.error || 'Could not send verification code.', 'error');
                return;
            }
            showMessage('Verification code sent. Check your email.');
            emailForm.classList.add('hidden');
            otpForm.classList.remove('hidden');
            otpInput.focus();
        });

        otpForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const res = await fetch('/api/auth/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: pendingEmail, otp: otpInput.value.trim() })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                showMessage(data.error || 'Invalid verification code.', 'error');
                return;
            }
            window.location.href = '/app';
        });

        changeEmailBtn.addEventListener('click', () => {
            otpForm.classList.add('hidden');
            emailForm.classList.remove('hidden');
            otpInput.value = '';
            message.classList.add('hidden');
            emailInput.focus();
        });
    </script>
</body>
</html>
