name = "blt-sizzle"
main = "workers/main.py"
compatibility_date = "2024-04-03"
compatibility_flags = ["python_workers"]

# Scheduled notifications - runs every hour ("0 * * * *") to check for users
# needing reminders. The schedule now runs from the blt-cron dispatcher Worker,
# which calls POST /__scheduled through a service binding with the CRON_SECRET
# secret (wrangler secret put CRON_SECRET). The empty list makes deploys remove
# the old trigger (the free plan allows only 5 cron triggers per account).
[triggers]
crons = []

# D1 Database binding
[[d1_databases]]
binding = "sizzle_db"
database_name = "sizzle-db"
database_id = "272f7618-e0af-42be-80b5-4ca1e0090356"
migrations_dir = "migrations"

# Configure assets (static files)
[assets]
directory = "src"
binding = "ASSETS"
html_handling = "none"
run_worker_first = [
  "/",
  "/index.html",
  "/login",
  "/app",
  "/dashboard",
  "/profile",
  "/organizations",
  "/leaderboard",
  "/settings",
  "/check-ins",
  "/checkins",
  "/pages",
  "/pages/*",
  "/__scheduled",
]


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
