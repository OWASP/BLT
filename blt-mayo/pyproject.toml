[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blt-mayo"
version = "0.3.1"
description = "BLT-MAYO Week 3 PR 1 shell dangerous-execution analyzer"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Jayant Malvi"}]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
blt-mayo = "blt_mayo.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["blt_mayo"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
omit = ["*/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
