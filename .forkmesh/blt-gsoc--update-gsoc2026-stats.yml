name: "blt-gsoc: Update GSoC 2026 Stats"
# Ported from .github/workflows/blt-gsoc--update-gsoc2026-stats.yml.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-stats:
    runs-on: runner
    timeout-minutes: 20
    defaults:
      run:
        working-directory: blt-gsoc
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Update generated stats
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: node scripts/update_gsoc2026_stats.js
      - name: Commit and deploy if changed
        run: |
          ../scripts/actions/commit-back.sh --deploy blt-gsoc -m "blt-gsoc: refresh gsoc2026 stats" -- js/gsoc2026_stats.generated.js
