name: "blt-owasp-metadata: Update Metadata Dataset"
# Ported from .github/workflows/blt-owasp-metadata--scraper.yml (was Python 3.11; runs on 3.13 here).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: write
jobs:
  scrape:
    runs-on: runner
    timeout-minutes: 60
    defaults:
      run:
        working-directory: blt-owasp-metadata
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Set up Python
        run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: Run metadata scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: .venv/bin/python scripts/scrape_metadata.py
      - name: Commit and deploy if changed
        run: |
          ../scripts/actions/commit-back.sh --deploy blt-owasp-metadata -m "blt-owasp-metadata: update metadata dataset" -- public/data
