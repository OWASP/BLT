name: "blt-owasp-metadata: Update Metadata Dataset"
# Ported from .github/workflows/blt-owasp-metadata--scraper.yml. Rebuilds the dataset
# (public/data/metadata*.{json,csv,md}) and writes it to the blt-owasp-metadata Worker's KV
# namespace (scripts/refresh-kv.sh), which serves it at the same paths. Nothing is committed and
# nothing is redeployed. The scraper stays here rather than in the Worker: it makes thousands of
# requests.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: read
jobs:
  scrape:
    runs-on: runner
    timeout-minutes: 60
    defaults:
      run:
        working-directory: blt-owasp-metadata
    steps:
      - name: Set up Python
        run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: Scrape metadata and write it to KV
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHON: .venv/bin/python
        run: scripts/refresh-kv.sh
