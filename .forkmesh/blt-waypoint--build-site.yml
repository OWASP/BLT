name: "blt-waypoint: Refresh Data"
# Regenerates public/forge_data.json (per-folder commits, issues and pull requests from
# git.owaspblt.org; scripts/generate_forge_data.py) in the runner checkout and writes it to the
# blt-waypoint Worker's KV namespace (scripts/worker-data/kv-put.sh). The Worker serves it at
# /forge_data.json and the old /gitlab_data.json. Nothing is committed and nothing is redeployed.
# About 200 anonymous requests, bounded by FORGE_BUDGET_SECONDS so a run cannot hold the single
# runner; when the budget runs out nothing is written and KV keeps the previous data.
# The main_data files derive from the committed github_data.json and are committed with it
# (python scripts/generate_main_data.py; the tests check they are current), so they are not here.
on:
  schedule:
    - cron: "29 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - blt-waypoint/scripts/generate_forge_data.py
      - blt-waypoint/scripts/forge_urls.py
      - scripts/routing/projects.tsv
permissions:
  contents: read
jobs:
  build-site:
    runs-on: runner
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blt-waypoint
    steps:
      - name: Generate forge_data.json
        env:
          FORGE_BUDGET_SECONDS: "420"
        run: python3 scripts/generate_forge_data.py
      - name: Write it to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../scripts/worker-data/kv-put.sh . public public/forge_data.json
