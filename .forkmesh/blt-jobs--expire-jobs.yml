name: "blt-jobs: Expire Stale Jobs"
# Ported from the expire_jobs job of blt-jobs/.gitlab-ci.yml (GitLab pipeline schedule or manual run).
# Manual only: the Worker drops expired jobs when it serves /data/jobs.json (blt-jobs/src/worker.py),
# so expired listings disappear on time without this run. Run it by hand to delete the expired
# jobs/*.md files (optional housekeeping; they stay in git history either way).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expire-jobs:
    runs-on: runner
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blt-jobs
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Expire stale jobs and rebuild data
        run: node scripts/expire-jobs.js && npm run build:jobs
      - name: Commit and deploy if changed
        run: |
          ../scripts/actions/commit-back.sh --deploy blt-jobs -m "blt-jobs: expire stale jobs" -- jobs public/data/jobs.json public/data/seekers.json
