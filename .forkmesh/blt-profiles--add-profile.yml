name: "blt-profiles: Add Profile"
# Replaces the Worker's GitLab issue webhook (/webhooks/gitlab/profile-submission), which created a
# branch, commit, merge request and note on gitlab.com. Here an "Add profile" issue
# (blt-profiles/issue-templates/add-profile.md) is committed straight to main by
# blt-profiles/scripts/actions/add-profile.mjs, which then comments and closes the issue.
on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to process
        required: true
        default: ""
        type: string
permissions:
  contents: write
jobs:
  add-profile:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.issue.state == 'open' && (
      contains(github.event.issue.labels.*.name, 'profile') ||
      contains(github.event.issue.labels.*.name, 'add-profile') ||
      contains(github.event.issue.labels.*.name, 'profile-submission') ||
      startsWith(github.event.issue.title, '[blt-profiles]') ||
      (contains(github.event.issue.body, '## Role Section') && contains(github.event.issue.body, '## Display Name'))))
    runs-on: runner
    timeout-minutes: 10
    defaults:
      run:
        working-directory: blt-profiles
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Commit the profile, deploy, comment and close
        run: node scripts/actions/add-profile.mjs
