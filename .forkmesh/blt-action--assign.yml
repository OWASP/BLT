name: "blt-action: /assign and /unassign"
# Forge port of BLT-Action's comment commands (blt-action/src/index.js). A comment whose line starts
# with /assign or /unassign assigns or unassigns the commenter (only themselves) on that issue.
# blt-action/forge/assign.mjs acts only on a verified author (the event's comment.user.verified, set
# when the forge bound the comment to the signed-in account; anything else gets a "sign in" reply),
# changes the assignment through the job API (POST issues/<n>/assignees, which notifies the assignee)
# and replies through the job API with "@user ...". On an instance without that endpoint it falls back
# to a signed `assignees` ledger event pushed with scripts/actions/commit-back.sh --rebuild.
# Rules, wording and setup: docs/workflows.md ("/assign and /unassign").
#
# Run by hand with an issue number to process the commands already in that issue's ledger (for
# comments made before this workflow existed, or a run that failed). Only ledger comments with
# authorVerified: true count.
#
# Secret: BLT_TASKS_SEED, the blt-tasks[bot] Ed25519 seed (base64url or 64 hex). Only the ledger
# fallback needs it; the job API path and refusals do not.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number whose /assign and /unassign comments to process
        required: true
        default: ""
        type: string
permissions:
  contents: write
jobs:
  assign:
    # A cheap pre-filter only; the script parses the comment itself (from the event JSON, never in a shell).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '/assign') || contains(github.event.comment.body, '/unassign')
    runs-on: runner
    timeout-minutes: 5
    env:
      BLT_TASKS_SEED: ${{ secrets.BLT_TASKS_SEED }}
    steps:
      - name: Apply the command, push the ledger and reply
        run: node blt-action/forge/assign.mjs
