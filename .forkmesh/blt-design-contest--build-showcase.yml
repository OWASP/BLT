name: "blt-design-contest: Build Showcase"
# Ported from the build_showcase job of blt-design-contest/.gitlab-ci.yml (it rebuilt public/ on every
# push and the Cloudflare deploy published it). Submissions are GitLab issues of
# owasp-blt/blt-design-contest, so the pages are rebuilt daily and committed.
on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - blt-design-contest/scripts/**
permissions:
  contents: write
jobs:
  build-showcase:
    runs-on: runner
    timeout-minutes: 30
    defaults:
      run:
        working-directory: blt-design-contest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Build showcase pages
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_PATH: owasp-blt/blt-design-contest
        run: |
          python3 scripts/build_showcase.py
          python3 scripts/vendor_github_assets.py
          if grep -R "https://github.com/user-attachments/assets/" public/*.html; then
            echo "un-vendored GitHub attachment links left in public/" >&2
            exit 1
          fi
      - name: Commit and deploy if changed
        run: |
          ../scripts/actions/commit-back.sh --deploy blt-design-contest -m "blt-design-contest: rebuild showcase pages" -- public
