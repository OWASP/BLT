name: "blt-design-contest: Build Showcase"
# Rebuilds the showcase pages from the git.owaspblt.org issue ledger (open blt-design-contest
# submission issues, native issue votes and +1 comments) plus the frozen GitLab entries in
# blt-design-contest/data/gitlab-archive.json, and writes the pages that changed to the Worker's KV
# (scripts/refresh-kv.sh). Nothing is committed and nothing is redeployed; the Worker serves the
# pages from KV under their usual URLs. Issue events on contest issues refresh at once; votes do not
# raise an issue event, so the daily run picks them up.
on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - blt-design-contest/scripts/**
      - blt-design-contest/data/**
permissions:
  contents: read
jobs:
  build-showcase:
    if: >-
      github.event_name != 'issues' ||
      startsWith(github.event.issue.title, '[blt-design-contest]') ||
      startsWith(github.event.issue.title, 'blt-design-contest:') ||
      contains(github.event.issue.labels.*.name, 'blt-design-contest') ||
      contains(github.event.issue.labels.*.name, 'project:blt-design-contest') ||
      contains(github.event.issue.labels.*.name, 'design-submission') ||
      contains(github.event.issue.labels.*.name, 'logo-submission') ||
      contains(github.event.issue.labels.*.name, 'homepage-submission') ||
      contains(github.event.issue.labels.*.name, 'video-meme-submission') ||
      contains(github.event.issue.labels.*.name, 'welcome-video-submission') ||
      contains(github.event.issue.labels.*.name, 'appsecil-tshirt-submission') ||
      contains(github.event.issue.labels.*.name, 'winner') ||
      github.event.label.name == 'winner'
    runs-on: runner
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blt-design-contest
    steps:
      - name: Build showcase pages and write changed ones to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/refresh-kv.sh
