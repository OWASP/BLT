name: "blt-owasp-bumper: Generate OWASP Repository List"
# Ported from .github/workflows/blt-owasp-bumper--generate-repo-list.yml and the pages job of
# blt-owasp-bumper/.gitlab-ci.yml (both generated the list; the site is served from public/).
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - blt-owasp-bumper/generate_repo_list.py
      - .forkmesh/blt-owasp-bumper--generate-repo-list.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: runner
    timeout-minutes: 30
    defaults:
      run:
        working-directory: blt-owasp-bumper
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Generate repository list
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GITHUB_ORG: owasp
          OUTPUT_FILE: public/index.html
        run: python3 generate_repo_list.py
      - name: Commit and deploy if changed
        run: |
          ../scripts/actions/commit-back.sh --deploy blt-owasp-bumper -m "blt-owasp-bumper: update repository list" -- public/index.html
