name: "blt-owasp-bumper: Generate OWASP Repository List"
# Ported from .github/workflows/blt-owasp-bumper--generate-repo-list.yml and the pages job of
# blt-owasp-bumper/.gitlab-ci.yml. Regenerates the dashboard page and writes it to the
# blt-owasp-bumper Worker's KV namespace (scripts/refresh-kv.sh), which serves it at / and
# /index.html. Nothing is committed and nothing is redeployed. The generator stays here rather
# than in the Worker: it makes several thousand GitHub requests.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - blt-owasp-bumper/generate_repo_list.py
      - blt-owasp-bumper/scripts/refresh-kv.sh
      - .forkmesh/blt-owasp-bumper--generate-repo-list.yml
permissions:
  contents: read
jobs:
  generate:
    runs-on: runner
    timeout-minutes: 30
    defaults:
      run:
        working-directory: blt-owasp-bumper
    steps:
      - name: Generate the repository list and write it to KV
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GITHUB_ORG: owasp
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/refresh-kv.sh
