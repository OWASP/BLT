name: "blt-owasp-projects: Refresh Data"
# Ported from the refresh_data job of blt-owasp-projects/.gitlab-ci.yml. Refreshes the dashboard data
# (www_project_repos, repo_status, issues, known_issue_ids, project_repos_links) and writes the
# changed files to the blt-owasp-projects Worker's KV namespace (scripts/refresh-kv.sh), which
# serves them at the same paths. Nothing is committed and nothing is redeployed. The fetch stays
# here rather than in the Worker: it is thousands of GitHub and owasp.org requests.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh-data:
    runs-on: runner
    timeout-minutes: 60
    defaults:
      run:
        working-directory: blt-owasp-projects
    steps:
      - name: Set up Python
        run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: Refresh project data and write it to KV
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHON: .venv/bin/python
        run: scripts/refresh-kv.sh
