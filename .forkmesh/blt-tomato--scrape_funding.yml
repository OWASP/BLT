name: "blt-tomato: Scrape Funding"
# Ported from .github/workflows/blt-tomato--scrape_funding.yml. Rebuilds the funding page
# (index.html) and project_repos_links.json and writes them to the blt-tomato Worker's KV
# namespace (scripts/refresh-kv.sh), which serves them at /, /index.html and
# /project_repos_links.json. Nothing is committed and nothing is redeployed. The scraper stays
# here rather than in the Worker: it reads FUNDING.yml from every OWASP repository.
on:
  push:
    branches: [main]
    paths:
      - blt-tomato/.github/scripts/**
      - blt-tomato/scripts/refresh-kv.sh
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 5"
permissions:
  contents: read
jobs:
  parse_repos:
    runs-on: runner
    timeout-minutes: 60
    defaults:
      run:
        working-directory: blt-tomato
    steps:
      - name: Set up Python
        run: python3 -m venv .venv && .venv/bin/pip install -q -r .github/scripts/funding/requirements.txt
      - name: Scrape funding files and write the page to KV
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHON: .venv/bin/python
        run: scripts/refresh-kv.sh
