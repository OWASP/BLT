name: "blt-tomato: Scrape Funding"
# Ported from .github/workflows/blt-tomato--scrape_funding.yml. The scraper writes into the current
# directory, so it runs inside public/ where the site's files live.
on:
  push:
    branches: [main]
    paths:
      - blt-tomato/.github/scripts/**
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 5"
permissions:
  contents: write
jobs:
  parse_repos:
    runs-on: runner
    timeout-minutes: 60
    defaults:
      run:
        working-directory: blt-tomato
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Set up Python
        run: python3 -m venv .venv && .venv/bin/pip install -q -r .github/scripts/funding/requirements.txt
      - name: Parse repositories
        working-directory: blt-tomato/public
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: ../.venv/bin/python ../.github/scripts/funding/owasp_funding_yml_scraper.py
      - name: Commit and deploy if changed
        run: |
          ../scripts/actions/commit-back.sh --deploy blt-tomato -m "blt-tomato: update repository funding status" -- public/project_repos_links.json public/index.html
