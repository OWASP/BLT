name: Refresh profile scorecards
# Rewrites the small AI scorecards that git.owaspblt.org shows on each person's profile page
# (.forkmesh/scorecards/<account>.json, see scripts/scorecards/README.md). Scores come from public
# BLT activity (commits, pulls, reviews, issues, comments); the AI only writes the encouraging text.
# A card is rewritten only when its numbers changed or it is older than 30 days, so a run costs a
# handful of AI calls. Claude writes the text when ANTHROPIC_API_KEY is set, Workers AI otherwise.
# Runs on the 1st and 15th of each month; run it by hand (workflow_dispatch) to update everyone now.
on:
  schedule:
    - cron: "23 4 1,15 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: runner
    timeout-minutes: 30
    steps:
      - name: Write the scorecards
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/scorecards/generate.py
      - name: Commit if changed
        run: |
          scripts/actions/commit-back.sh -m "scorecards: refresh profile scorecards" -- .forkmesh/scorecards
