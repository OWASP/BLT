name: "blt-panini: Update Slack Apps List"
# Ported from .github/workflows/blt-panini--update_slack_apps.yml. Scrapes the Slack App Directory,
# merges new apps into slack_apps.json and writes it to the blt-panini Worker's KV namespace
# (scripts/refresh-kv.sh), which serves it at /slack_apps.json. Nothing is committed and nothing
# is redeployed. The scraper stays here rather than in the Worker: it pages through every category.
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-slack-apps:
    runs-on: runner
    timeout-minutes: 60
    defaults:
      run:
        working-directory: blt-panini
    steps:
      - name: Set up Python
        run: python3 -m venv .venv && .venv/bin/pip install -q -r scripts/requirements.txt
      - name: Scrape Slack apps and write the list to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHON: .venv/bin/python
        run: scripts/refresh-kv.sh
