name: "blt-hackathons: Update Statistics"
# Ported from .github/workflows/blt-hackathons--update-stats.yml. Refreshes hackathons starting
# through 2026-05-31; blt-hackathons--update-future-hackathons.yml covers the later ones.
on:
  push:
    branches: [main]
    paths:
      - blt-hackathons/**
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-stats:
    runs-on: runner
    timeout-minutes: 45
    defaults:
      run:
        working-directory: blt-hackathons
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Set up Python
        run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: Parse hackathons config
        run: node scripts/parse_hackathons_config.js public/js/hackathons-config.js "$PWD/.venv/hackathons-config-parsed.json"
      - name: Fetch and update statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          UPDATE_HACKATHONS_STARTING_THROUGH: "2026-05-31 23:59:59+00:00"
        run: HACKATHONS_CONFIG_PATH="$PWD/.venv/hackathons-config-parsed.json" .venv/bin/python fetch_stats.py
      - name: Commit and deploy if changed
        run: |
          ../scripts/actions/commit-back.sh --deploy blt-hackathons -m "blt-hackathons: update statistics" -- public/stats.json public/hackathon-data
