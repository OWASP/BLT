name: "blt-hackathons: Update Statistics"
# Refreshes the statistics of every hackathon that has not ended and writes the changed files to
# the blt-hackathons Worker's KV namespace (scripts/refresh-kv.sh). The Worker serves them at
# /stats.json and /hackathon-data/*.json. Nothing is committed and nothing is redeployed.
# The fetch stays here rather than in the Worker: a first sync is hundreds of requests, and a
# free-plan Worker invocation may make 50.
# BLT hackathons read git.owaspblt.org (pulls and issues of the monorepo, by project folder);
# gitlab.com/owasp-blt is closed. The sync is incremental (only pull/issue folders whose git oid
# changed are re-read; the cache is the KV key state/fetch-state.json) and stops after
# FETCH_BUDGET_SECONDS, saving its progress, so one run cannot hold the single runner: a steady
# run takes seconds, and the 30-minute timeout is only a backstop.
on:
  push:
    branches: [main]
    paths:
      - blt-hackathons/**
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-stats:
    runs-on: runner
    timeout-minutes: 30
    defaults:
      run:
        working-directory: blt-hackathons
    steps:
      - name: Set up Python
        run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: Fetch statistics and write them to KV
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}  # only for third-party GitLab hackathons
          SLACK_TOKEN_OWASP: ${{ secrets.SLACK_TOKEN_OWASP }}  # optional: Slack counts (trackSlack)
          SLACK_TOKEN_BLT: ${{ secrets.SLACK_TOKEN_BLT }}
          FETCH_BUDGET_SECONDS: "900"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHON: .venv/bin/python
        run: scripts/refresh-kv.sh
