name: "blt-hackathons: Update Statistics"
# Refreshes the statistics of every hackathon that has not ended and writes the changed files to
# the blt-hackathons Worker's KV namespace (scripts/refresh-kv.sh). The Worker serves them at
# /stats.json and /hackathon-data/*.json. Nothing is committed and nothing is redeployed.
# The fetch stays here rather than in the Worker: one refresh is hundreds of GitHub/GitLab
# requests, and a free-plan Worker invocation may make 50.
# Every 6 hours, not hourly: the hackathons still running are GitLab-based (57 projects for one
# event), so an hourly run hit GitLab's anonymous rate limit, slept for minutes at a time and held
# the single runner while other jobs queued.
on:
  push:
    branches: [main]
    paths:
      - blt-hackathons/**
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-stats:
    runs-on: runner
    timeout-minutes: 30
    defaults:
      run:
        working-directory: blt-hackathons
    steps:
      - name: Set up Python
        run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: Fetch statistics and write them to KV
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHON: .venv/bin/python
        run: scripts/refresh-kv.sh
