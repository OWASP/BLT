name: "blt-hackathons: Update Future Hackathons"
# Ported from the update-future-hackathons job of blt-hackathons/.gitlab-ci.yml (a daily GitLab
# pipeline schedule per the README). Refreshes hackathons starting after 2026-05-31.
on:
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-future-hackathons:
    runs-on: runner
    timeout-minutes: 45
    defaults:
      run:
        working-directory: blt-hackathons
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Set up Python
        run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: Parse hackathons config
        run: node scripts/parse_hackathons_config.js public/js/hackathons-config.js "$PWD/.venv/hackathons-config-parsed.json"
      - name: Fetch and update statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          UPDATE_HACKATHONS_STARTING_AFTER: "2026-05-31T23:59:59Z"
        run: HACKATHONS_CONFIG_PATH="$PWD/.venv/hackathons-config-parsed.json" .venv/bin/python fetch_stats.py
      - name: Commit and deploy if changed
        run: |
          ../scripts/actions/commit-back.sh --deploy blt-hackathons -m "blt-hackathons: update statistics for future hackathons" -- public/stats.json public/hackathon-data
