name: "blt-pages: Update Leaderboard"
# Reads the blt-pages bug reports (issues labelled bug that belong to blt-pages) and the leadership
# nominations ("[NOMINATION] ..." issues, votes = the forge's issue votes) from git.owaspblt.org, and
# writes data/leaderboard.json, data/leaders.json and the pre-rendered index.html and leaderboard.html
# to the blt-pages Worker's KV (blt-pages/scripts/refresh-kv.sh). Nothing is committed or redeployed.
# Runs when a relevant issue changes, when the generator or a pre-rendered page changes (so KV never
# keeps an old page), and once a day as a safety net.
on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - blt-pages/scripts/**
      - blt-pages/public/index.html
      - blt-pages/public/leaderboard.html
      - blt-pages/public/data/leaders.json
permissions:
  contents: read
jobs:
  update-leaderboard:
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.title, 'blt-pages') ||
      contains(github.event.issue.title, '[NOMINATION]') ||
      contains(github.event.issue.labels.*.name, 'blt-pages') ||
      contains(github.event.issue.labels.*.name, 'nomination')
    runs-on: runner
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blt-pages
    steps:
      - name: Generate the leaderboard and write it to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/refresh-kv.sh
