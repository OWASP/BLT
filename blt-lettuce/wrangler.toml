name = "blt-lettuce"
main = "src/worker.py"
compatibility_date = "2026-03-01"
compatibility_flags = ["python_workers"]

[build]
command = "python scripts/migrate.py"

[assets]
directory = "."
binding = "ASSETS"
include = ["data/**", "src/data/**", "docs/static/**"]

[[d1_databases]]
binding = "DB"
database_name = "blt-lettuce"
database_id = "b68ec3d9-6766-4496-b926-c8a24f29f2dd"
migrations_dir = "./migrations"

[vars]
VERSION = "2.0.0"
# The OWASP welcome (README "OWASP welcome bot"): WELCOME_TEAM_IDS defaults to "T04T40NHX" in
# code. WELCOME_ENABLED is deliberately not a var here: it is a secret
# (`npx wrangler secret put WELCOME_ENABLED`), so a deploy can't undo the cut-over.

# Cron ("* * * * *", every minute) now runs from the blt-cron dispatcher Worker,
# which calls POST /__scheduled through a service binding with the CRON_SECRET
# secret (wrangler secret put CRON_SECRET). The empty list makes deploys remove
# the old trigger (the free plan allows only 5 cron triggers per account).
[triggers]
crons = []

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
destinations = [ "sentry-logs" ]

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
destinations = [ "sentry-traces" ]

