<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Internal Server Error - BLT Lettuce</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --page: #f9fafb; --card: #fff; --fg: #111827; --fg2: #4b5563; --line: #e5e7eb;
            --accent: #dc2626; --accent-hover: #b91c1c; --btn2: #f3f4f6; --btn2-hover: #e5e7eb; --btn2-fg: #374151;
            --note-bg: #fef2f2; --note-line: #fecaca; --note-fg: #991b1b;
        }
        html.dark {
            --page: #030712; --card: #111827; --fg: #f3f4f6; --fg2: #9ca3af; --line: #1f2937;
            --accent: #ef4444; --accent-hover: #dc2626; --btn2: #1f2937; --btn2-hover: #374151; --btn2-fg: #e5e7eb;
            --note-bg: rgba(127, 29, 29, .3); --note-line: rgba(248, 113, 113, .3); --note-fg: #fca5a5;
        }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--page);
            color: var(--fg);
            min-height: 100vh;
        }

        .container {
            max-width: 640px;
            width: calc(100% - 40px);
            margin: 64px auto;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 56px 40px;
            text-align: center;
        }

        .error-code {
            font-size: 112px;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 14px;
            color: var(--fg);
        }

        p {
            font-size: 18px;
            color: var(--fg2);
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .note {
            background: var(--note-bg);
            border: 1px solid var(--note-line);
            border-radius: 10px;
            color: var(--note-fg);
            font-size: 14px;
            padding: 12px;
            margin-bottom: 24px;
        }

        .links {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        a {
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--btn2);
            color: var(--btn2-fg);
        }

        .btn-secondary:hover {
            background: var(--btn2-hover);
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 84px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 16px;
            }

            .container {
                margin: 24px auto;
                padding: 36px 22px;
            }

            .links {
                flex-direction: column;
            }

            a {
                width: 100%;
            }
        }
    </style>
    <script src="https://js.sentry-cdn.com/73ec24fc4cd44cec10017d622968ee3a.min.js" crossorigin="anonymous"></script>
    <script src="/_brand/theme-init.js"></script>
    <link rel="stylesheet" href="/_brand/blt-dark.css" />
    <script src="https://owaspblt.org/_shared/blt-nav.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="error-code">500</div>
        <h1>Something Went Wrong</h1>
        <p>An unexpected server error occurred. The incident was reported for investigation.</p>
        <div class="note">If this happened during Slack sign-in, retry in a few seconds. If it persists, check <code>/status</code>.</div>

        <div class="links">
            <a href="/" class="btn-primary">Back to Home</a>
            <a href="/status" class="btn-secondary">View Status</a>
        </div>
    </div>
</body>
</html>
