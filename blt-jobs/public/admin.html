<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLT Jobs Admin</title>
    <link rel="icon" href="./assets/images/blt-logo.png" type="image/png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
          },
        },
      };
    </script>
    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "dark") document.documentElement.classList.add("dark");
        else if (savedTheme === "light") document.documentElement.classList.remove("dark");
        else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased dark:bg-gray-900 dark:text-gray-100">
    <div id="navbar-placeholder"></div>

    <main class="mx-auto max-w-7xl px-4 pt-28 pb-12 sm:px-6 lg:px-8">
      <section id="login-panel" class="mx-auto max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-800">
        <div class="mb-6 flex items-center gap-3">
          <span class="inline-flex h-11 w-11 items-center justify-center rounded-lg bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
          </span>
          <div>
            <h1 class="text-xl font-bold dark:text-white">Admin Login</h1>
            <p class="text-sm text-slate-500 dark:text-gray-400">Candidate email console</p>
          </div>
        </div>

        <form id="login-form" class="space-y-4">
          <label class="block">
            <span class="text-sm font-medium text-slate-700 dark:text-gray-300">Username</span>
            <input id="admin-username" autocomplete="username" required class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm shadow-sm focus:border-red-500 focus:outline-none focus:ring-1 focus:ring-red-500 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100" />
          </label>
          <label class="block">
            <span class="text-sm font-medium text-slate-700 dark:text-gray-300">Password</span>
            <input id="admin-password" type="password" autocomplete="current-password" required class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm shadow-sm focus:border-red-500 focus:outline-none focus:ring-1 focus:ring-red-500 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100" />
          </label>
          <button type="submit" class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800">
            <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
            Sign in
          </button>
        </form>
        <p id="login-status" class="mt-4 hidden rounded-lg px-3 py-2 text-sm"></p>
      </section>

      <section id="admin-panel" class="hidden">
        <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h1 class="text-3xl font-bold tracking-tight dark:text-white">Candidate Email</h1>
            <p class="mt-1 text-sm text-slate-500 dark:text-gray-400">Messages are sent from jobs@owaspblt.org</p>
          </div>
          <button id="logout-button" type="button" class="inline-flex items-center gap-2 self-start rounded-lg border border-slate-200 bg-white px-3.5 py-2 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700">
            <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
            Log out
          </button>
        </div>

        <div class="grid gap-6 lg:grid-cols-[minmax(280px,360px),1fr]">
          <aside class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm dark:border-gray-700 dark:bg-gray-800">
            <div class="mb-4 flex items-center justify-between gap-3">
              <h2 class="text-base font-semibold dark:text-white">Candidates</h2>
              <span id="selected-count" class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600 dark:bg-gray-700 dark:text-gray-300">0 selected</span>
            </div>
            <label class="relative block">
              <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" aria-hidden="true"></i>
              <input id="candidate-search" type="search" placeholder="Search candidates" class="w-full rounded-lg border border-slate-200 bg-white py-2 pl-9 pr-3 text-sm shadow-sm focus:border-red-500 focus:outline-none focus:ring-1 focus:ring-red-500 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100" />
            </label>
            <div class="mt-3 flex gap-2">
              <button id="select-visible" type="button" class="inline-flex flex-1 items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700">
                <i class="fa-solid fa-check-double" aria-hidden="true"></i>
                Select visible
              </button>
              <button id="clear-selection" type="button" class="inline-flex flex-1 items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700">
                <i class="fa-solid fa-eraser" aria-hidden="true"></i>
                Clear
              </button>
            </div>
            <div id="candidate-list" class="mt-4 max-h-[34rem] space-y-2 overflow-y-auto pr-1">
              <p class="text-sm text-slate-500 dark:text-gray-400">Loading candidates...</p>
            </div>
          </aside>

          <form id="email-form" class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm dark:border-gray-700 dark:bg-gray-800">
            <div class="grid gap-4">
              <label class="block">
                <span class="text-sm font-medium text-slate-700 dark:text-gray-300">Additional recipients</span>
                <textarea id="manual-recipients" rows="3" placeholder="name@example.com, another@example.com" class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm shadow-sm focus:border-red-500 focus:outline-none focus:ring-1 focus:ring-red-500 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100"></textarea>
              </label>
              <label class="block">
                <span class="text-sm font-medium text-slate-700 dark:text-gray-300">Subject</span>
                <input id="email-subject" required class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm shadow-sm focus:border-red-500 focus:outline-none focus:ring-1 focus:ring-red-500 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100" />
              </label>
              <label class="block">
                <span class="text-sm font-medium text-slate-700 dark:text-gray-300">Message</span>
                <textarea id="email-message" rows="14" required class="mt-1 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm shadow-sm focus:border-red-500 focus:outline-none focus:ring-1 focus:ring-red-500 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-100"></textarea>
              </label>
            </div>
            <div class="mt-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
              <p id="send-status" class="hidden rounded-lg px-3 py-2 text-sm"></p>
              <button id="send-button" type="submit" class="inline-flex items-center justify-center gap-2 rounded-lg bg-red-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800">
                <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                Send email
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/saved-jobs.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/admin.js"></script>
  </body>
</html>
