name = "blt-jobs"
compatibility_date = "2026-05-31"

[assets]
directory = "./.worker-assets"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
