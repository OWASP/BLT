name = "blt-vanish"
main = "src/index.ts"
compatibility_date = "2023-12-01"

# Workers configuration
workers_dev = true

# Environment variables (optional)
[env.production]
name = "blt-vanish-production"

[env.development]
name = "blt-vanish-development"

# CORS and security settings
[build]
command = "tsc"

# Limits
[limits]
cpu_ms = 50

# Analytics bindings are intentionally omitted to preserve privacy.
