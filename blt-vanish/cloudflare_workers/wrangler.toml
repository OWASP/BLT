name = "blt-vanish"
main = "src/index.py"
compatibility_date = "2026-05-31"
compatibility_flags = ["python_workers", "disable_python_external_sdk"]

# Workers configuration
workers_dev = true

# Environment variables (optional)
[env.production]
name = "blt-vanish-production"

[env.development]
name = "blt-vanish-development"

[assets]
directory = "../docs"
run_worker_first = ["/api", "/api/*"]

# Analytics bindings are intentionally omitted to preserve privacy.
