# Not run anywhere: this repository runs .forkmesh/ workflows (see docs/workflows.md).
# Jobs already ported to .forkmesh/ or scripts/ci/tests.tsv were removed; these remain for reference.
# Tests run in scripts/ci/tests.tsv; the frontend build and deploys run in scripts/deploy.sh.

stages:
  - lint

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.pre-commit-cache"

# ---------------------------------------------------------------------------
# Lint Stage
# ---------------------------------------------------------------------------

lint:python:
  stage: lint
  image: python:3.13-slim
  cache:
    key: pip-lint
    paths:
      - .pip-cache/
      - .pre-commit-cache/
  before_script:
    - pip install black ruff bandit
  script:
    - black --check .
    - ruff check .
    - bandit -c pyproject.toml -r src/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
