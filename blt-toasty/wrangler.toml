# Wrangler configuration for Toasty Cloudflare Worker
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "blt-toasty"
main = "src/worker.py"
compatibility_date = "2024-12-10"

# Python Workers configuration
# Cloudflare Workers supports Python through the Python Workers runtime
# Specify that this is a Python worker
compatibility_flags = ["python_workers"]

[ai]
binding = "AI"

# Worker settings
workers_dev = true

[build]
command = ""

# Serve the landing page and its styles directly from Cloudflare's static
# assets layer while keeping backend requests routed through the Worker.
[assets]
directory = "frontend/dist"
run_worker_first = ["/api/*", "/health", "/mcp/*", "/admin/*", "/conversations/*", "/triage/*", "/webhook/*", "/__scheduled"]

# Cron — no scheduled work (the GitLab shadow-mode job was removed). The blt-cron
# dispatcher Worker still calls POST /__scheduled hourly through a service binding
# with the CRON_SECRET secret; on_scheduled is a no-op.
# The empty list makes deploys remove the old trigger (free plan: 5 per account).
[triggers]
crons = []


# D1: shared with blt-timer-web in "blt-apps" (no table names overlap); each app
# tracks its own migrations in its own table.
[[d1_databases]]
binding = "DB"
database_name = "blt-apps"
database_id = "540fc4ae-6347-43fd-b6da-1fcc4eb219d9"
migrations_dir = "migrations"
migrations_table = "d1_migrations_toasty"

# Environment variables
[env.production]
name = "toasty-backend-prod"

[env.production.vars]
FASTEMBED_URL = "https://fastembed.internal"

[[env.production.d1_databases]]
binding = "DB"
database_name = "blt-apps"
database_id = "540fc4ae-6347-43fd-b6da-1fcc4eb219d9"
migrations_table = "d1_migrations_toasty"

[[env.production.durable_objects.bindings]]
name = "CONVERSATION_DO"
class_name = "ConversationDO"

[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "RateLimiterDO"

[[env.production.vectorize]]
binding = "VECTORIZE"
index_name = "toasty-embeddings"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "toasty_telemetry"

[env.staging]
name = "toasty-backend-staging"

[env.staging.vars]
FASTEMBED_URL = "https://fastembed-staging.internal"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "toasty-db-staging"
database_id = "00000000-0000-0000-0000-000000000002"

[[env.staging.durable_objects.bindings]]
name = "CONVERSATION_DO"
class_name = "ConversationDO"

[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "RateLimiterDO"

[[env.staging.vectorize]]
binding = "VECTORIZE"
index_name = "toasty-embeddings-staging"

[[env.staging.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "toasty_telemetry_staging"

[env.development]
name = "toasty-backend-dev"

[env.development.vars]
FASTEMBED_URL = "http://localhost:5003"

[[env.development.d1_databases]]
binding = "DB"
database_name = "toasty-db"
database_id = "00000000-0000-0000-0000-000000000003"

[[env.development.durable_objects.bindings]]
name = "CONVERSATION_DO"
class_name = "ConversationDO"

[[env.development.durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "RateLimiterDO"

[[env.development.vectorize]]
binding = "VECTORIZE"
index_name = "toasty-embeddings-dev"

[[env.development.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "toasty_telemetry_dev"

[[migrations]]
tag = "v1"
new_classes = ["ConversationDO"]

[[migrations]]
tag = "v2"
new_classes = ["RateLimiterDO"]

[vars]
ENVIRONMENT = "development"
LOG_LEVEL = "info"
# MCP Export JWT public key (RSA, SPKI PEM, set via wrangler secret)
# MCP_PUBLIC_KEY is set via `wrangler secret put MCP_PUBLIC_KEY`

# [placement]
# mode = "smart" # Uncomment this to enable Smart Placement when deploying to Cloudflare


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
