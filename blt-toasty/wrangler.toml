# Wrangler configuration for Toasty Cloudflare Worker
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "blt-toasty"
main = "worker.py"
compatibility_date = "2024-12-10"

# Python Workers configuration
# Cloudflare Workers supports Python through the Python Workers runtime
# Specify that this is a Python worker
compatibility_flags = ["python_workers"]

# Worker settings
workers_dev = true
route = ""
zone_id = ""

[build]
command = ""

# Serve the landing page and its styles directly from Cloudflare's static
# assets layer while keeping backend requests routed through the Worker.
[assets]
directory = "./docs"
run_worker_first = ["/api/*", "/health"]

# Environment variables
[env.production]
name = "toasty-backend-prod"

[env.staging]
name = "toasty-backend-staging"

[env.development]
name = "toasty-backend-dev"

[env.development.vars]
FASTEMBED_URL = "http://fastembed_sidecar:8000"
# Routes for the worker (configure based on your domain)
# [[routes]]
# pattern = "api.toasty.example.com/*"
# zone_name = "example.com"

# D1 Databases for storage
[[d1_databases]]
binding = "DB"
database_name = "toasty-db"
database_id = "local-db-placeholder"

# KV Namespaces for storage (if needed)
[[kv_namespaces]]
binding = "TOASTY_KV"
id = "local-kv-placeholder"

# Durable Objects for stateful conversation management
[[durable_objects.bindings]]
name = "CONVERSATION_DO"
class_name = "ConversationDO"

[[migrations]]
tag = "v1"
new_classes = ["ConversationDO"]

# R2 Buckets (if needed for file storage)
# [[r2_buckets]]
# binding = "TOASTY_BUCKET"
# bucket_name = "toasty-files"

# Vectorize index for semantic duplicate detection
[[vectorize]]
binding = "VECTORIZE"
index_name = "toasty-embeddings"

[vars]
ENVIRONMENT = "development"
LOG_LEVEL = "info"

# [placement]
# mode = "smart" # Uncomment this to enable Smart Placement when deploying to Cloudflare


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
