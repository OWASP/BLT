<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BLT-Toasty — AI Code Review Dashboard</title>
    <meta name="description"
          content="BLT-Toasty is an AI-powered triage and responsible disclosure assistant for the OWASP Bug Logging Tool (BLT). Monitor webhooks, PII redaction, duplicate detection, and triage operations in real time." />
    <meta name="keywords"
          content="OWASP, BLT, Bug Logging Tool, AI, Triage, Bug Bounty" />
    <script>
      // Before first paint: the saved theme (localStorage "theme", shared with the <blt-nav> bar), else the system preference.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("theme"); } catch (e) { saved = null; }
        var dark = saved === "dark" || (saved !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <script src="https://owaspblt.org/_shared/blt-nav.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>
  <body class="min-h-screen overflow-x-hidden font-sans text-dark-base antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
