stages:
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip

build-docs:
  stage: build
  image: python:3.13-slim
  script:
    - pip install -r requirements.txt
    - mkdocs build
  artifacts:
    paths:
      - site/
    expire_in: 1 week

deploy-docs:
  stage: deploy
  image: node:22-slim
  needs:
    - job: build-docs
      artifacts: true
  cache: []
  script:
    - npx wrangler@4 deploy
  environment:
    name: production
    url: https://docs.owaspblt.org/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
