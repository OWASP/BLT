# Static site (public/) plus a Worker (worker/index.js) that serves /stats.json and
# /hackathon-data/*.json from KV (binding DATA). The hourly workflow
# .forkmesh/blt-hackathons--update-stats.yml writes those keys; nothing is committed to git.
name = "blt-hackathons"
main = "worker/index.js"
compatibility_date = "2026-08-29"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/stats.json", "/hackathon-data/*"]

# Created by scripts/worker-data/create-kv.sh, which replaces the placeholder id.
[[kv_namespaces]]
binding = "DATA"
id = "a632d043da1640518fcef63f1c2de64d"

[[routes]]
pattern = "hackathons.owaspblt.org"
custom_domain = true
