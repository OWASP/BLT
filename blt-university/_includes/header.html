<blt-nav project="blt-university" name="University" current="auto" data-sticky>
  {%- assign header_navigation = site.header_navigation | default: site.navigation %}
  {%- for item in header_navigation %}
  <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
  {%- endfor %}
  {%- for item in site.header_actions %}
  <a href="{{ item.url | relative_url }}" slot="actions"{% if item.style == "primary" %} data-primary{% endif %}>{{ item.title }}</a>
  {%- endfor %}
</blt-nav>
