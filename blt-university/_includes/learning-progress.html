<section data-learning-progress class="min-w-0 overflow-hidden rounded-[2rem] border border-gray-100 bg-white p-5 shadow-soft dark:border-gray-800 dark:bg-gray-900 sm:p-6" aria-labelledby="learning-progress-heading-{{ include.context | default: 'page' }}">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <p class="text-[10px] font-bold uppercase tracking-widest text-bltRed">Your learning momentum</p>
      <h2 id="learning-progress-heading-{{ include.context | default: 'page' }}" class="mt-1 text-xl font-bold text-gray-900 dark:text-white">Learning progress</h2>
      <p class="mt-2 max-w-2xl text-sm leading-6 text-gray-500 dark:text-gray-400">Progress stays in this browser. Complete lessons, challenges, and labs to build a streak and unlock achievement badges.</p>
    </div>
    <span class="inline-flex w-fit items-center gap-2 rounded-full bg-red-50 px-3 py-1.5 text-xs font-semibold text-red-700 dark:bg-red-900/20 dark:text-red-300">
      <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
      Stored locally
    </span>
  </div>

  <div data-learning-progress-stats class="mt-6 grid min-w-0 grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-6" aria-live="polite"></div>

  <div class="mt-8">
    <h3 class="text-sm font-bold text-gray-900 dark:text-white">Achievement badges</h3>
    <div data-learning-progress-badges class="mt-3 grid min-w-0 gap-3 sm:grid-cols-2 xl:grid-cols-4"></div>
  </div>
</section>
