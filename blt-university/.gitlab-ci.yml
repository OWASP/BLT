stages:
  - build
  - deploy

variables:
  JEKYLL_ENV: production
  BUNDLE_PATH: vendor/bundle

cache:
  key:
    files:
      - Gemfile
  paths:
    - vendor/bundle

build_site:
  image: ruby:3.2
  stage: build
  script:
    - bundle install
    - bundle exec jekyll build -d public
  artifacts:
    paths:
      - public
    expire_in: 1 week

pages:
  image: alpine:3.20
  stage: deploy
  needs:
    - job: build_site
      artifacts: true
  script:
    - test -d public
  pages:
    publish: public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
