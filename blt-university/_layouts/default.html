<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo %}
    <link rel="icon" href="{{ '/assets/images/blt-university-logo.svg' | relative_url }}" type="image/svg+xml">

    <script src="https://owaspblt.org/_shared/blt-nav.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        // Dark mode theme: saved choice (shared with the OWASP BLT top bar), else the system preference
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', dark);
        })();
    </script>
    <script src="https://cdn.tailwindcss.com/3.4.17?plugins=typography@0.5.16"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
                    },
                    colors: {
                        bltRed: '#dc2626',
                        bltRedLight: '#fee2e2',
                        bltRedHover: '#b91c1c',
                        bltDark: '#111827',
                        bltCoral: '#ef4444',
                        bltFooter: '#0e0d0c'
                    },
                    boxShadow: {
                        soft: '0 1px 2px rgba(17,24,39,0.04)',
                        float: '0 10px 24px -18px rgba(220,38,38,.8)'
                    }
                }
            }
        };
    </script>
    <style>
        /* The OWASP BLT top bar (<blt-nav>, sticky) is the only header. */
        blt-nav:not(:defined) { display: block; min-height: 61px; }
        blt-nav:not(:defined) > * { display: none; }
        /* Basic dark mode for pages without their own dark: variants (explicit dark: classes win). */
        html.dark { color-scheme: dark; }
        html.dark .bg-white { background-color: #111827; }
        html.dark .bg-gray-50, html.dark .bg-\[\#fafafa\] { background-color: #030712; }
        html.dark .bg-gray-100 { background-color: #1f2937; }
        html.dark .bg-white\/40 { background-color: rgba(17, 24, 39, 0.6); }
        html.dark .bg-red-50, html.dark .bg-red-50\/50 { background-color: rgba(127, 29, 29, 0.25); }
        html.dark .from-red-50 { --tw-gradient-from: rgba(127, 29, 29, 0.25) var(--tw-gradient-from-position); --tw-gradient-to: transparent var(--tw-gradient-to-position); --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to); }
        html.dark .to-white { --tw-gradient-to: #111827 var(--tw-gradient-to-position); }
        html.dark .border-red-100, html.dark .border-red-200 { border-color: rgba(153, 27, 27, 0.5); }
        html.dark .text-red-600, html.dark .text-red-700 { color: #f87171; }
        html.dark .text-gray-900, html.dark .text-bltDark { color: #f3f4f6; }
        html.dark .text-gray-800, html.dark .text-gray-700 { color: #d1d5db; }
        html.dark .text-gray-600, html.dark .text-gray-500 { color: #9ca3af; }
        html.dark .border-gray-100, html.dark .border-gray-200, html.dark .border-gray-300 { border-color: #1f2937; }
        html.dark .dot-field { background-image: radial-gradient(rgba(243, 244, 246, 0.14) 1px, transparent 1px); }
        .dot-field {
            background-image: radial-gradient(rgba(17, 24, 39, 0.18) 1px, transparent 1px);
            background-size: 18px 18px;
            mask-image: radial-gradient(circle at center, black 0, transparent 74%);
            -webkit-mask-image: radial-gradient(circle at center, black 0, transparent 74%);
        }
        .feature-divider::before,
        .feature-divider::after {
            content: "";
            height: 1px;
            flex: 1;
        }
        .feature-divider::before {
            background: linear-gradient(to right, transparent, #e5e7eb);
        }
        .feature-divider::after {
            background: linear-gradient(to left, transparent, #e5e7eb);
        }
        .wave-dots i {
            position: absolute;
            width: 0.25rem;
            height: 0.25rem;
            border-radius: 999px;
            background: #d1d5db;
            animation: wave 2s infinite ease-in-out;
        }
        .wave-dots i:nth-child(1) { top: 0; left: 0; }
        .wave-dots i:nth-child(2) { top: 0; left: 1rem; }
        .wave-dots i:nth-child(3) { top: 0.25rem; left: 0.5rem; animation-delay: 0.35s; }
        .wave-dots i:nth-child(4) { top: 0.5rem; left: 0; animation-delay: 0.55s; }
        .wave-dots i:nth-child(5) { top: 0.5rem; left: 1rem; animation-delay: 0.55s; }
        .wave-dots i:nth-child(6) { top: 0.75rem; left: 0.5rem; animation-delay: 0.85s; }
        .section-kicker.with-bar::before {
            content: "";
            position: absolute;
            top: 0.18rem;
            left: -0.55rem;
            width: 3px;
            height: 1.25rem;
            border-radius: 0 2px 2px 0;
            background: #ef4444;
        }
        .footer-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.04;
            background-image:
              linear-gradient(rgba(255,255,255,1) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255,255,255,1) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .footer-links p {
            margin: 0 0 0.35rem;
            color: #6b7280;
            font-size: 0.625rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }
        .footer-links a {
            display: block;
            color: #d1d5db;
            font-size: 0.875rem;
            line-height: 1.55;
            transition: color 180ms ease;
        }
        .footer-links a:hover {
            color: white;
        }
        @keyframes wave {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            50% {
                transform: translateY(-3px);
                opacity: 1;
            }
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden bg-gray-50 font-sans text-gray-900 antialiased selection:bg-red-100 selection:text-red-700 dark:bg-gray-950 dark:text-gray-100 flex flex-col">

    {% include header.html %}

    {{ content }}

    <div class="px-4">
        {% include footer.html %}
    </div>

    <script src="{{ '/assets/js/learning-state.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
    <script src="{{ '/assets/js/recommendations.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
