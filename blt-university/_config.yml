# BLT University Configuration
title: BLT University
description: >-
  A cybersecurity-focused online university powered by GitHub Pages and GitLab Pages.
  Learn, teach, and collaborate on security courses through open-source education.

baseurl: ""
url: "https://university.owaspblt.org"

# University Information
university:
  name: BLT University
  tagline: "Open Source Cybersecurity Education"
  email: contact@bltuniversity.org
  established: 2026
  
# Build settings
theme: minima
markdown: kramdown
permalink: pretty
port: 4001
include:
  - _pages

# Collections
collections:
  courses:
    output: true
    permalink: /courses/:path/

  instructors:
    output: true
    permalink: /instructors/:path/

  labs:
    output: true
    permalink: /labs/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "courses"
    values:
      layout: "course"
  - scope:
      path: ""
      type: "instructors"
    values:
      layout: "instructor"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - .agents/
  - .codex/
  - .git/
  - .github/
  - .gitignore
  - .gitlab-ci.yml
  - CNAME
  - CONTRIBUTING.md
  - FIX_PROPOSAL.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - QUICKSTART.md
  - node_modules
  - public/
  - README.md
  - SETUP.md
  - wrangler.toml
  - _config.yml
  - assets/images/courses/README.md
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation
navigation:
  - title: Home
    url: /
  - title: Courses
    url: /courses/
  - title: Enroll
    url: /enroll/
  - title: Request a Course
    url: /request/
  - title: Instructors
    url: /instructors/
  - title: Labs
    url: /labs/
  - title: About
    url: /about/

# Course Categories
categories:
  - Web Security
  - Network Security
  - Cryptography
  - Penetration Testing
  - Secure Coding
  - Malware Analysis
  - Cloud Security
  - Mobile Security
  - Incident Response
  - Security Operations
