stages:
  - test
  - deploy

backend-tests:
  stage: test
  image: python:3.13

  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"

  script:
    - pytest -v backend/tests

  cache:
    paths:
      - .cache/pip

  artifacts:
    when: always
    expire_in: 1 week

deploy-staging:
  stage: deploy
  image: node:22
  when: manual

  before_script:
    - npm ci
    - npx wrangler login --api-key "$CLOUDFLARE_API_TOKEN"

  script:
    - npx wrangler d1 migrations apply hackerhouse --remote --env staging
    - npx wrangler deploy --env staging

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-production:
  stage: deploy
  image: node:22
  when: manual
  needs: [deploy-staging]

  before_script:
    - npm ci
    - npx wrangler login --api-key "$CLOUDFLARE_API_TOKEN"

  script:
    - npx wrangler d1 migrations apply hackerhouse --remote
    - npx wrangler deploy

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
