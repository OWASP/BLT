stages:
  - test
  - deploy

backend-tests:
  stage: test
  image: python:3.13

  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"

  script:
    - pytest -v backend/tests

  cache:
    paths:
      - .cache/pip

  artifacts:
    when: always
    expire_in: 1 week

.deploy_base: &deploy_base
  stage: deploy
  image: python:3.13
  before_script:
    - pip install uv
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - npm ci
    - npx wrangler login --api-key "$CLOUDFLARE_API_TOKEN"

deploy-staging:
  <<: *deploy_base
  when: manual
  script:
    - npx wrangler d1 migrations apply hackerhouse --remote --env staging
    - uv run pywrangler deploy --env staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-production:
  <<: *deploy_base
  when: manual
  needs: [deploy-staging]
  script:
    - npx wrangler d1 migrations apply hackerhouse --remote
    - uv run pywrangler deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
