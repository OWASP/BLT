# Static site (public/) plus a Worker (worker/index.js) that serves /slack_apps.json from KV
# (binding DATA). The workflow .forkmesh/blt-panini--update_slack_apps.yml (weekly) writes it;
# nothing is committed to git.
name = "blt-panini"
main = "worker/index.js"
compatibility_date = "2026-05-31"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/slack_apps.json"]

# Created by scripts/worker-data/create-kv.sh, which replaces the placeholder id.
[[kv_namespaces]]
binding = "DATA"
id = "8acfabf29b564b2aa62765965994a9b4"
