openapi: 3.1.0
info:
  title: NetGuardian Worker API
  version: 0.1.0-week1
  description: Week 1 stub — expand as routes land. CI drift check optional until Week 2.

paths:
  /health:
    get:
      summary: Liveness
      responses:
        "200":
          description: OK

  /api/ng/ingest:
    post:
      summary: Ingest signed ztr-finding-1 envelope
      parameters:
        - name: X-BLT-Body-Digest
          in: header
          required: true
          schema:
            type: string
            example: sha256=abc123...
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZtrEnvelope"
      responses:
        "201":
          description: Created
        "200":
          description: Duplicate nonce (idempotent)
        "400":
          description: Invalid envelope / digest / clock skew
        "401":
          description: Bad signature or unknown kid
        "413":
          description: Payload too large
        "429":
          description: Rate limited

  /api/ng/findings:
    get:
      summary: List findings (org-scoped, Week 3+)
      responses:
        "200":
          description: OK

  /api/ng/findings/{id}:
    get:
      summary: Finding detail (Week 4+)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden

components:
  schemas:
    ZtrEnvelope:
      allOf:
        - type: object
          required:
            - version
            - org_id
            - sender_id
            - kid
            - alg
            - issued_at
            - nonce
            - payload_digest
            - signature
          properties:
            version:
              type: string
              const: ztr-finding-1
            org_id:
              type: string
            sender_id:
              type: string
            kid:
              type: string
            alg:
              type: string
              enum: [hmac-sha256]
            issued_at:
              type: string
              format: date-time
              pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"
            nonce:
              type: string
            payload_digest:
              type: string
              pattern: "^[a-f0-9]{64}$"
            signature:
              type: string
              pattern: "^[a-f0-9]{64}$"
        - oneOf:
            - type: object
              required: [plaintext_mode, payload_plaintext]
              properties:
                plaintext_mode:
                  type: boolean
                  const: true
                payload_plaintext:
                  type: object
                  additionalProperties: true
              not:
                required: [payload_ciphertext]
            - type: object
              required: [payload_ciphertext]
              properties:
                payload_ciphertext:
                  type: string
                  contentEncoding: base64
              not:
                anyOf:
                  - required: [payload_plaintext]
                  - properties:
                      plaintext_mode:
                        const: true

    IngestError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - invalid_envelope
            - invalid_payload_mode
            - digest_mismatch
            - clock_skew
            - bad_signature
            - unknown_kid
            - payload_too_large
            - rate_limited
        message:
          type: string
