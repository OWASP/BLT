# Not run anywhere: this repository runs .forkmesh/ workflows (see docs/workflows.md).
# Jobs already ported to .forkmesh/ or scripts/ci/tests.tsv were removed; these remain for reference.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

stages:
  - test

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/client/.pub-cache"

flutter:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable
  cache:
    key: flutter-pub
    paths:
      - client/.pub-cache
  before_script:
    - cd client
    - flutter pub get
  script:
    - flutter analyze --no-fatal-infos
    - flutter test
