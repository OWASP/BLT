<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetGuardian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0d0000; --panel: #0d0000; --red: #ff2020; --gold: #c9a227; --muted: #888; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: #eee;
      font-family: "Share Tech Mono", ui-monospace, monospace;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    main { max-width: 640px; width: 100%; }
    h1 {
      font-family: Orbitron, sans-serif; color: var(--red); letter-spacing: 0.18em;
      font-size: 1.1rem; margin: 0 0 8px;
    }
    p { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 28px; }
    .row { display: grid; gap: 12px; }
    @media (min-width: 560px) { .row { grid-template-columns: 1fr 1fr; } }
    a.card {
      display: block; text-decoration: none; color: inherit;
      border: 1px solid var(--red); padding: 20px; background: var(--panel);
    }
    a.card:hover { border-color: var(--gold); }
    a.card strong {
      font-family: Orbitron, sans-serif; color: var(--gold);
      letter-spacing: 0.12em; font-size: 12px; display: block; margin-bottom: 8px;
    }
    a.card span { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>NETGUARDIAN</h1>
    <p>
      Signed ingest + triage. The old autonomous-scanner homepage is not the product.
      Use the scanner client to send findings; use triage to review them.
    </p>
    <div class="row">
      <a class="card" href="/client/">
        <strong>CLIENT</strong>
        <span>Scan a URL, sign, and POST /api/ingest</span>
      </a>
      <a class="card" href="/triage">
        <strong>TRIAGE</strong>
        <span>Org queue, evidence, convert, export</span>
      </a>
    </div>
  </main>
</body>
</html>
