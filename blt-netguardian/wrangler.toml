name = "blt-netguardian"
main = "src/worker.py"
compatibility_date = "2024-01-01"
compatibility_flags = ["python_workers"]

# Static assets (HTML, CSS, JS, images) served directly by Cloudflare
[assets]
directory = "./public"
binding = "ASSETS"


# Environment variables
[vars]
ENVIRONMENT = "production"
# Set via wrangler secret (production/staging):
#   BLT_API_BASE_URL = https://api.owaspblt.org/v2
#   BLT_API_KEY      = <X-BLT-API-Key value>

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# D1 Database Binding
# Replace the placeholder ID below with your actual Cloudflare D1 database ID.
# Create a D1 database via: wrangler d1 create blt-netguardian
# Apply migrations via: wrangler d1 migrations apply blt-netguardian
[[d1_databases]]
binding = "DB"
database_name = "blt-netguardian"
database_id = "529b739a-6643-4574-9210-99ecd384f085"
migrations_dir = "migrations"

# Note: Durable Objects removed - not implemented yet
# Note: Build configuration removed - Workers Python runtime doesn't need pip install
