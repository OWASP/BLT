name = "blt-netguardian"
main = "src/worker.py"
compatibility_date = "2025-07-01"
compatibility_flags = ["python_workers", "global_fetch_strictly_public"]

# Static assets: serve HTML/JS directly; only /api/* invokes the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true


# Environment variables
[vars]
ENVIRONMENT = "production"
AUTHENTICATE_READ_ENDPOINTS = "false"
NG_DEFAULT_ORG = "org-demo"
# Flutter web (localhost:8888) + hosted triage on netguardian.owaspblt.org.
CORS_ALLOWED_ORIGINS = "https://netguardian.owaspblt.org,http://localhost:8888,http://127.0.0.1:8888"
# Scheduled self-scan (src/self_scan.py): hosts OWASP BLT operates, header-checked
# by the cron (one GET of "/" per host per day; at most one host per 5-minute run).
# Listing a host here is the operator's consent to scan it; never add a host you do
# not run. Third-party hosts are scanned only by researchers' clients. Empty = off.
NG_SELF_SCAN_TARGETS = "owaspblt.org api.owaspblt.org git.owaspblt.org netguardian.owaspblt.org"
# NG_SELF_SCAN_INTERVAL_HOURS = "24"   # 1..720
# NG_SELF_SCAN_MAX_PER_RUN = "1"       # 1..3
# NG_SELF_SCAN_ORG = "org-demo"        # defaults to NG_DEFAULT_ORG
# Set via wrangler secret (production/staging):
#   CRON_SECRET          = shared with blt-cron (set)
#   NG_ORG_API_TOKENS    = {"<triage/queue token>":"org-demo"}  (triage writes, queue writes)
#   NG_SENDER_SECRETS    = {"org-demo:<sender>:<kid>":"<hex HMAC key>"}  (POST /api/ingest)
#   NG_PAYLOAD_KEYS      = {"org-demo":"<base64 32-byte AES key>"}  (encrypted ingest only)
#   BLT_API_BASE_URL = https://api.owaspblt.org/v2
#   BLT_API_KEY      = <X-BLT-API-Key value>
# Optional GitHub OAuth + PKCE (browser sessions; Bearer tokens still work):
#   GITHUB_CLIENT_ID
#   GITHUB_CLIENT_SECRET
#   GITHUB_OAUTH_REDIRECT_URI = https://netguardian.owaspblt.org/api/auth/github/callback
#   NG_GITHUB_ORG_MAP = {"your-gh-login":"org-demo"}
#   NG_GITHUB_DEFAULT_ORG = org-demo
# Optional verified-events webhook (HMAC-SHA256 over request body):
#   NG_EVENTS_WEBHOOK_URL    = https://consumer.example/hooks/netguardian
#   NG_EVENTS_WEBHOOK_SECRET = <hex or utf-8 secret>

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Cron ("*/5 * * * *") now runs from the blt-cron dispatcher Worker, which calls
# POST /__scheduled through a service binding with the CRON_SECRET secret
# (wrangler secret put CRON_SECRET). The empty list makes deploys remove the old
# trigger (the free plan allows only 5 cron triggers per account).
[triggers]
crons = []

# Optional R2 evidence bucket (uncomment after: wrangler r2 bucket create ng-evidence)
# [[r2_buckets]]
# binding = "EVIDENCE"
# bucket_name = "ng-evidence"

# D1 Database Binding
# Production (OWASP account): 529b739a-6643-4574-9210-99ecd384f085 → netguardian.owaspblt.org
# For a personal/staging deploy, override with: wrangler d1 create blt-netguardian
[[d1_databases]]
binding = "DB"
database_name = "blt-netguardian"
database_id = "529b739a-6643-4574-9210-99ecd384f085"
migrations_dir = "migrations"

# Note: Durable Objects removed - not implemented yet
# Note: Build configuration removed - Workers Python runtime doesn't need pip install
