name = "blt-netguardian"
main = "src/worker.py"
compatibility_date = "2025-07-01"
compatibility_flags = ["python_workers", "global_fetch_strictly_public"]

# Static assets: serve HTML/JS directly; only /api/* invokes the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true


# Environment variables
[vars]
ENVIRONMENT = "production"
AUTHENTICATE_READ_ENDPOINTS = "false"
NG_DEFAULT_ORG = "org-demo"
# Set via wrangler secret (production/staging):
#   BLT_API_BASE_URL = https://api.owaspblt.org/v2
#   BLT_API_KEY      = <X-BLT-API-Key value>

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# D1 Database Binding
# Production (OWASP account): 529b739a-6643-4574-9210-99ecd384f085 → netguardian.owaspblt.org
# For a personal/staging deploy, override with: wrangler d1 create blt-netguardian
[[d1_databases]]
binding = "DB"
database_name = "blt-netguardian"
database_id = "529b739a-6643-4574-9210-99ecd384f085"
migrations_dir = "migrations"

# Note: Durable Objects removed - not implemented yet
# Note: Build configuration removed - Workers Python runtime doesn't need pip install
