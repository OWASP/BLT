# Static site (public/) plus a Worker (worker/index.js) that serves /data/ossh_catalog.json from KV
# (binding DATA). The workflow .forkmesh/blt-ossh--update-catalog.yml (daily) writes it; nothing is
# committed to git.
name = "blt-ossh"
main = "worker/index.js"
compatibility_date = "2026-06-06"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/data/ossh_catalog.json"]

# Created by scripts/worker-data/create-kv.sh, which replaces the placeholder id.
[[kv_namespaces]]
binding = "DATA"
id = "REPLACE_WITH_KV_ID_blt-ossh-data"
