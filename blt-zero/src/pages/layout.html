<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <meta name="description" content="BLT-Zero - zero-trust vulnerability reporting platform" />
  <meta name="theme-color" content="#f9fafb" />
  <script>
    // Before first paint: the saved theme (localStorage "theme", shared with the <blt-nav> bar), else the system preference.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) { saved = null; }
      var dark = saved === "dark" || (saved !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
  <script src="https://owaspblt.org/_shared/blt-nav.js" defer></script>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#dc2626",
            "primary-foreground": "#ffffff",
            "primary-dark": "#b91c1c",
            ink: "#111827",
            muted: "#6b7280",
            line: "#e5e7eb",
            panel: "#ffffff",
            wash: "#f9fafb"
          },
          boxShadow: {
            soft: "0 24px 70px -46px rgba(17, 24, 39, .65)",
            button: "0 12px 26px -18px rgba(220, 38, 38, .85)"
          },
          fontFamily: {
            sans: ["ui-sans-serif", "system-ui", "-apple-system", "BlinkMacSystemFont", '"Segoe UI"', "Roboto", '"Helvetica Neue"', "Arial", "sans-serif"],
            mono: ["ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "monospace"]
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html,
    body {
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(220, 38, 38, .08), transparent 28rem),
        #f9fafb;
      color: #111827;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .dot-field {
      background-image: radial-gradient(rgba(17, 24, 39, .16) 1px, transparent 1px);
      background-size: 18px 18px;
      -webkit-mask-image: radial-gradient(circle at center, black 0, transparent 72%);
      mask-image: radial-gradient(circle at center, black 0, transparent 72%);
    }

    .section-kicker::before {
      content: "";
      position: absolute;
      top: .15rem;
      left: -.65rem;
      height: 1.2rem;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: #ef4444;
    }

    .text-balance { text-wrap: balance; }
    .text-pretty { text-wrap: pretty; }

    blt-nav:not(:defined) { display: block; min-height: 61px; }
    blt-nav:not(:defined) > * { display: none; }

    .footer-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .04;
      background-image:
        linear-gradient(rgba(255, 255, 255, 1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 1) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    input,
    textarea {
      color-scheme: light;
    }

    .msg-ok {
      margin: 0;
      color: #059669;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: .875rem;
      line-height: 1.5rem;
    }

    .msg-error {
      margin: 0;
      color: #dc2626;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: .875rem;
      line-height: 1.5rem;
    }

    /* Dark mode (html.dark, set by the pre-paint script and the <blt-nav> toggle): remap the
       light utility classes the pages use onto the owaspblt.org dark palette (gray-950 page,
       gray-900 cards, gray-800 borders). */
    html.dark body {
      background:
        radial-gradient(circle at top left, rgba(220, 38, 38, .10), transparent 28rem),
        #030712;
      color: #f3f4f6;
    }
    html.dark .dot-field { background-image: radial-gradient(rgba(255, 255, 255, .10) 1px, transparent 1px); }
    html.dark .bg-white, html.dark .hover\:bg-white:hover { background-color: #111827; }
    html.dark .bg-white\/50, html.dark .bg-white\/90, html.dark .bg-white\/95 { background-color: rgba(17, 24, 39, .85); }
    html.dark .bg-gray-50, html.dark .hover\:bg-gray-50:hover { background-color: #030712; }
    html.dark .bg-gray-100, html.dark .hover\:bg-gray-100:hover { background-color: #1f2937; }
    html.dark .bg-gray-900 { background-color: #374151; }
    html.dark .bg-red-50 { background-color: rgba(127, 29, 29, .25); }
    html.dark .bg-amber-50 { background-color: rgba(120, 53, 15, .25); }
    html.dark .border-gray-100, html.dark .border-gray-200, html.dark .border-gray-300, html.dark .border-black\/5 { border-color: #1f2937; }
    html.dark .border-red-100, html.dark .border-red-200 { border-color: rgba(185, 28, 28, .45); }
    html.dark .border-amber-200 { border-color: rgba(180, 83, 9, .45); }
    html.dark .text-gray-900, html.dark .hover\:text-gray-900:hover { color: #f3f4f6; }
    html.dark .text-gray-700 { color: #d1d5db; }
    html.dark .text-gray-600, html.dark .text-gray-500 { color: #9ca3af; }
    html.dark .text-red-600, html.dark .text-red-500 { color: #f87171; }
    html.dark .text-amber-700 { color: #fbbf24; }
    html.dark .bg-gray-600 { background-color: #9ca3af; }
    html.dark input, html.dark textarea { color-scheme: dark; }
    html.dark .focus\:ring-red-100:focus { --tw-ring-color: rgba(127, 29, 29, .5); }
    html.dark .msg-ok { color: #34d399; }
    html.dark .msg-error { color: #f87171; }
  </style>
  {{TURNSTILE_SCRIPT}}
</head>
<body class="font-sans antialiased selection:bg-red-100 selection:text-red-700">
  <blt-nav project="blt-zero" name="Zero" current="auto" data-sticky>
    <a href="/">Submit</a>
    <a href="/docs/security">Security</a>
    <a href="/docs/org-onboarding">Onboarding</a>
    <a href="/docs/decrypt">Decrypt</a>
    <a href="/admin/onboard" slot="actions">Admin</a>
    <a href="https://git.owaspblt.org/BLT/BLT-Zero" slot="actions" data-primary target="_blank" rel="noopener noreferrer">Contribute</a>
  </blt-nav>

  <main class="relative overflow-hidden">
    <div class="dot-field pointer-events-none absolute inset-x-0 top-0 z-0 mx-auto h-[28rem] w-[min(88rem,100vw)] opacity-50" aria-hidden="true"></div>
    <div class="relative z-10">
      {{BODY}}
    </div>
  </main>

  <footer class="mt-20 px-2">
    <div class="footer-panel relative mx-auto max-w-[98rem] overflow-hidden rounded-t-xl bg-[#0e0d0c] px-6 pb-10 pt-8 text-white sm:px-10 lg:px-14">
      <div class="relative">
        <h2 class="mx-auto whitespace-nowrap text-center text-[2.1rem] font-light leading-none text-white sm:text-[5.5rem] md:text-[7rem] lg:text-[8.5rem]">
          zero.owaspblt.org
        </h2>
        <div class="mx-auto mt-5 h-[3px] w-16 rounded-full bg-red-600" aria-hidden="true"></div>

        <nav class="mx-auto mt-10 grid max-w-5xl grid-cols-2 gap-x-10 gap-y-8 font-mono md:grid-cols-4" aria-label="Footer navigation">
          <div>
            <p class="mb-3 text-[0.65rem] font-semibold uppercase tracking-[.18em] text-gray-600">Reports</p>
            <a class="block text-sm leading-7 text-gray-300 transition-colors hover:text-white" href="/">Submit</a>
            <a class="block text-sm leading-7 text-gray-300 transition-colors hover:text-white" href="/admin/onboard">Admin</a>
          </div>
          <div>
            <p class="mb-3 text-[0.65rem] font-semibold uppercase tracking-[.18em] text-gray-600">Docs</p>
            <a class="block text-sm leading-7 text-gray-300 transition-colors hover:text-white" href="/docs/security">Security</a>
            <a class="block text-sm leading-7 text-gray-300 transition-colors hover:text-white" href="/docs/org-onboarding">Onboarding</a>
            <a class="block text-sm leading-7 text-gray-300 transition-colors hover:text-white" href="/docs/decrypt">Decrypt</a>
          </div>
          <div>
            <p class="mb-3 text-[0.65rem] font-semibold uppercase tracking-[.18em] text-gray-600">Project</p>
            <a class="block text-sm leading-7 text-gray-300 transition-colors hover:text-white" href="https://git.owaspblt.org/BLT/BLT-Zero" target="_blank" rel="noopener noreferrer">Source Code</a>
            <a class="block text-sm leading-7 text-gray-300 transition-colors hover:text-white" href="https://git.owaspblt.org/BLT/BLT-Core" target="_blank" rel="noopener noreferrer">OWASP BLT repo</a>
          </div>
          <div>
            <p class="mb-3 text-[0.65rem] font-semibold uppercase tracking-[.18em] text-gray-600">OWASP</p>
            <a class="block text-sm leading-7 text-gray-300 transition-colors hover:text-white" href="https://owaspblt.org" target="_blank" rel="noopener noreferrer">OWASP BLT</a>
            <a class="block text-sm leading-7 text-gray-300 transition-colors hover:text-white" href="https://owasp.org/www-project-bug-logging-tool/" target="_blank" rel="noopener noreferrer">Foundation page</a>
            <a class="block text-sm leading-7 text-gray-300 transition-colors hover:text-white" href="https://owasp.org" target="_blank" rel="noopener noreferrer">owasp.org</a>
          </div>
        </nav>
      </div>
    </div>
  </footer>

</body>
</html>
